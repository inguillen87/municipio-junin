<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics | MuniControl</title>
  <link rel="icon" href="img/municontrol-icon.jpg" type="image/jpeg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/dashboard.css">
  <style>
    .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
    @media (max-width: 1024px) { .charts-grid { grid-template-columns: 1fr; } }
    .chart-card { background: var(--bg-card); padding: 1.5rem; border-radius: var(--radius-lg); border: 1px solid var(--border-color); }
    .chart-title { font-size: 1.25rem; font-weight: 600; margin-bottom: 1.5rem; color: var(--text-light); display: flex; align-items: center; gap: 0.5rem; }
    .chart-container { position: relative; height: 300px; width: 100%; }
  </style>
</head>
<body>
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main-content" id="mainContent">
    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-btn" id="menuBtn" aria-label="Menu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="page-title">
          <h1>Analytics & BI</h1>
          <span class="breadcrumb">Cuadro de Mando Integral</span>
        </div>
      </div>
      <div class="topbar-right">
        <div class="topbar-avatar" id="topbarAvatar">SA</div>
      </div>
    </header>
    
    <div class="content-wrapper">
      <div class="charts-grid">
        <div class="chart-card">
          <h2 class="chart-title">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20V10M18 20V4M6 20v-4"/></svg>
            Evolucion de Gastos por Secretaria
          </h2>
          <div class="chart-container">
            <canvas id="chartGastoMensual"></canvas>
          </div>
        </div>
        
        <div class="chart-card">
          <h2 class="chart-title">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.21 15.89A10 10 0 1 1 8 2.83M22 12A10 10 0 0 0 12 2v10z"/></svg>
            Ejecucion Presupuestaria
          </h2>
          <div class="chart-container">
            <canvas id="chartPresupuestoDoughnut"></canvas>
          </div>
        </div>

        <div class="chart-card">
          <h2 class="chart-title">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            Horas Extra (Ultimos 6 meses)
          </h2>
          <div class="chart-container">
            <canvas id="chartHorasExtra"></canvas>
          </div>
        </div>

        <div class="chart-card">
          <h2 class="chart-title">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
            Radar de Objetivos
          </h2>
          <div class="chart-container">
            <canvas id="chartEjecucionRadar"></canvas>
          </div>
        </div>
      </div>
    </div>
  </main>
  
  <script src="js/nav.js"></script>
  <script>buildSidebar('analytics');</script>
  <script src="js/db.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="js/charts-premium.js"></script>
  <script>
    function initCharts() {
      if (!window.Chart || !window.MuniCharts) { setTimeout(initCharts, 200); return; }
      try { MuniCharts.gastoMensual('chartGastoMensual'); } catch(e) { console.error(e); }
      try { MuniCharts.presupuesto('chartPresupuestoDoughnut'); } catch(e) { console.error(e); }
      try { MuniCharts.horasExtra('chartHorasExtra'); } catch(e) { console.error(e); }
      try { MuniCharts.ejecucionRadar('chartEjecucionRadar'); } catch(e) { console.error(e); }
    }
    setTimeout(initCharts, 500);
  </script>
</body>
</html>
