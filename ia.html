<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="img/municontrol-icon.jpg" type="image/jpeg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#3b82f6" />
  <title>Asistente Inteligente | MuniControl</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/dashboard.css">
  <style>
    .ia-container { display: flex; flex-direction: column; height: calc(100vh - 120px); gap: 20px; }
    .ia-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.06); padding-bottom: 10px; }
    .ia-tabs { display: flex; gap: 10px; }
    .ia-tab-btn { padding: 8px 16px; border: none; background: rgba(255,255,255,0.05); color: var(--text-muted); border-radius: 8px; cursor: pointer; font-weight: 700; }
    .ia-tab-btn.active { background: rgba(59,130,246,0.2); color: #60a5fa; }
    
    .ia-tab-panel { flex: 1; display: none; flex-direction: column; overflow: hidden; }
    
    /* Chat Tab */
    .chat-history { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
    .msg { display: flex; gap: 10px; max-width: 80%; }
    .msg.bot { align-self: flex-start; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg-avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.1); font-size: 20px; }
    .msg.bot .msg-avatar { background: linear-gradient(135deg, #3b82f6, #8b5cf6); }
    .msg-content { background: rgba(255,255,255,0.05); padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.5; color: var(--text-primary); }
    .msg.user .msg-content { background: rgba(59,130,246,0.15); border: 1px solid rgba(59,130,246,0.3); }
    
    .quick-prompts { display: flex; gap: 10px; padding: 10px 20px; overflow-x: auto; }
    .quick-prompt-btn { padding: 6px 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; color: var(--text-muted); font-size: 12px; cursor: pointer; white-space: nowrap; }
    .quick-prompt-btn:hover { background: rgba(255,255,255,0.1); color: var(--text-primary); }
    
    .chat-input-area { padding: 20px; border-top: 1px solid rgba(255,255,255,0.06); }
    .chat-input-wrap { display: flex; gap: 10px; align-items: center; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 5px 10px; }
    .chat-input-wrap textarea { flex: 1; background: transparent; border: none; outline: none; color: var(--text-primary); resize: none; font-family: inherit; font-size: 14px; padding: 10px; }
    .icon-btn { background: none; border: none; cursor: pointer; font-size: 20px; opacity: 0.7; transition: opacity 0.2s; }
    .icon-btn:hover { opacity: 1; }
    .send-btn { background: #3b82f6; color: white; border: none; border-radius: 8px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px; }
    
    /* Simplifica Tab */
    .simplifica-layout { display: flex; gap: 20px; height: 100%; }
    .simplifica-col { flex: 1; display: flex; flex-direction: column; gap: 15px; }
    .simplifica-textarea { flex: 1; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 15px; color: var(--text-primary); font-family: inherit; resize: none; }
    .simplifica-result { flex: 1; background: rgba(16,185,129,0.05); border: 1px solid rgba(16,185,129,0.2); border-radius: 12px; padding: 15px; color: var(--text-primary); overflow-y: auto; display: none; }
  </style>
</head>
<body>
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main-content" id="mainContent">
    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-btn" id="menuBtn">☰</button>
        <div class="page-title">
          <h1>Asistente Inteligente</h1>
          <span class="breadcrumb">Consultas y Análisis con IA</span>
        </div>
      </div>
    </header>

    <div class="page-content">
      <div class="card ia-container">
        
        <div class="ia-header" style="padding: 16px;">
          <div class="ia-tabs">
            <button class="ia-tab-btn active" onclick="switchTab('chat', this)">💬 Chat</button>
            <button class="ia-tab-btn" onclick="switchTab('simplifica', this)">📄 Simplifica IA</button>
          </div>
          <button id="btnToggleAI" onclick="toggleAIMode()" style="padding:8px 16px;background:rgba(139,92,246,0.1);border:1px solid rgba(139,92,246,0.2);color:#a78bfa;border-radius:9px;cursor:pointer;font-weight:700;font-size:13px">🤖 IA Demo</button>
        </div>

        <!-- CHAT TAB -->
        <div id="tabChat" class="ia-tab-panel" style="display: flex;">
          <div class="chat-history" id="chatHistory">
            <div class="msg bot">
              <div class="msg-avatar">🤖</div>
              <div class="msg-content">
                <p>👋 <strong>¡Hola! Soy el Asistente IA del Municipio de Junín.</strong></p>
                <p>Puedo ayudarte con:</p>
                <ul style="margin-top: 10px; margin-left: 20px;">
                  <li>📊 Consultas sobre gastos, presupuesto y RRHH</li>
                  <li>📄 <strong>Leer y analizar documentos</strong></li>
                  <li>🔍 <strong>Resumen del municipio</strong></li>
                </ul>
              </div>
            </div>
          </div>
          
          <div class="quick-prompts">
            <button class="quick-prompt-btn" onclick="setPrompt('Resumen del municipio')">Resumen del municipio</button>
            <button class="quick-prompt-btn" onclick="setPrompt('Reclamos pendientes')">Reclamos pendientes</button>
            <button class="quick-prompt-btn" onclick="setPrompt('Presupuesto del mes')">Presupuesto del mes</button>
          </div>
          
          <div class="chat-input-area">
            <div class="chat-input-wrap">
              <button class="icon-btn" title="Adjuntar archivo">📎</button>
              <textarea id="chatInput" placeholder="Escribí tu consulta..." rows="1" onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault(); sendMessage();}"></textarea>
              <button class="icon-btn" title="Hablar por micrófono">🎤</button>
              <button class="send-btn" onclick="sendMessage()">➤</button>
            </div>
          </div>
        </div>

        <!-- SIMPLIFICA TAB -->
        <div id="tabSimplifica" class="ia-tab-panel" style="padding: 20px;">
          <div class="simplifica-layout">
            <div class="simplifica-col">
              <h3 style="font-size:14px; margin-bottom:10px;">Texto Original Legal/Técnico</h3>
              <textarea id="simplificaInput" class="simplifica-textarea" placeholder="Pegá el texto complejo de ordenanzas, resoluciones o expedientes aquí..."></textarea>
              <button onclick="doSimplifica()" style="padding:12px;background:linear-gradient(135deg,#10b981,#059669);border:none;color:white;border-radius:9px;cursor:pointer;font-weight:700;font-size:14px;margin-top:10px">✨ Simplificar para el Ciudadano</button>
            </div>
            <div class="simplifica-col">
              <h3 style="font-size:14px; margin-bottom:10px;">Versión Simplificada</h3>
              <div id="simplificaResult" class="simplifica-result">
                <div id="simplificaOutput"></div>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </main>

  <script src="js/nav.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/db.js"></script>
  <script src="js/hf-client.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      if (typeof buildSidebar === 'function') buildSidebar('ia');
      
      const btn = document.getElementById('btnToggleAI');
      if (btn && localStorage.getItem('ia_real_mode') === 'true') {
        btn.textContent = '⚡ IA Real (HF)';
        btn.style.background = 'rgba(139,92,246,0.2)';
        btn.style.color = '#c4b5fd';
      }
    });

    function switchTab(tabId, btn) {
      document.querySelectorAll('.ia-tab-panel').forEach(p => p.style.display = 'none');
      document.querySelectorAll('.ia-tab-btn').forEach(b => b.classList.remove('active'));
      const targetPanel = document.getElementById('tab' + tabId.charAt(0).toUpperCase() + tabId.slice(1));
      if (targetPanel) {
        targetPanel.style.display = tabId === 'chat' ? 'flex' : 'block';
      }
      if (btn) btn.classList.add('active');
    }

    function toggleAIMode() {
      const current = localStorage.getItem('ia_real_mode') === 'true';
      localStorage.setItem('ia_real_mode', !current);
      const btn = document.getElementById('btnToggleAI');
      if (btn) {
        btn.textContent = !current ? '⚡ IA Real (HF)' : '🤖 IA Demo';
        btn.style.background = !current ? 'rgba(139,92,246,0.2)' : 'rgba(139,92,246,0.1)';
        btn.style.color = !current ? '#c4b5fd' : '#a78bfa';
      }
      if (typeof showToast !== 'undefined') {
        showToast(!current ? '⚡ IA Real activada — Hugging Face API' : '🤖 Modo Demo activado', 'info');
      }
    }

    function setPrompt(text) {
      document.getElementById('chatInput').value = text;
      sendMessage();
    }

    async function sendMessage() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;

      appendMessage('user', text);
      input.value = '';

      const isReal = localStorage.getItem('ia_real_mode') === 'true';
      
      const typingId = 'typing_' + Date.now();
      appendMessage('bot', '...', typingId);

      let reply = '';
      if (isReal && window.HFClient) {
        try {
          const res = await window.HFClient.chat(text);
          reply = res.text || res.error || 'Ocurrió un error con la API.';
        } catch(e) {
          reply = 'Error de conexión con Hugging Face.';
        }
      } else {
        // Demo mode responses
        if (text.toLowerCase().includes('resumen')) {
          reply = '📊 **Resumen del Municipio:**\n- 247 Reclamos activos\n- 15 Obras en ejecución\n- Presupuesto ejecutado: 45%';
        } else if (text.toLowerCase().includes('reclamos')) {
          reply = '🏘️ **Reclamos:** Actualmente hay 247 reclamos pendientes. El 60% corresponde a luminarias y bacheo.';
        } else if (text.toLowerCase().includes('presupuesto')) {
          reply = '💰 **Presupuesto del mes:** Se ha ejecutado el 45% del presupuesto asignado para Obras Públicas. Los gastos en RRHH están al 98% de lo proyectado.';
        } else {
          reply = 'Esta es una respuesta simulada (Modo Demo). Cambiá a "IA Real" para usar Hugging Face API.';
        }
      }

      document.getElementById(typingId).remove();
      appendMessage('bot', reply.replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>'));
    }

    function appendMessage(sender, text, id) {
      const history = document.getElementById('chatHistory');
      const msg = document.createElement('div');
      msg.className = `msg ${sender}`;
      if (id) msg.id = id;
      
      const avatar = sender === 'user' ? '👤' : '🤖';
      
      msg.innerHTML = `
        <div class="msg-avatar">${avatar}</div>
        <div class="msg-content">${text}</div>
      `;
      history.appendChild(msg);
      history.scrollTop = history.scrollHeight;
    }

    async function doSimplifica() {
      const input = document.getElementById('simplificaInput');
      const result = document.getElementById('simplificaResult');
      const output = document.getElementById('simplificaOutput');
      
      if (!input || !input.value.trim()) {
        if (typeof showToast !== 'undefined') showToast('Ingresá el texto a simplificar', 'warning');
        return;
      }
      
      result.style.display = 'none';
      if (typeof showToast !== 'undefined') showToast('🤖 Simplificando con IA...', 'info');

      let simplified = '';
      const isReal = localStorage.getItem('ia_real_mode') === 'true';

      if (isReal && window.HFClient) {
        try {
          const res = await window.HFClient.simplifica(input.value);
          simplified = res.text || res.error || 'No se pudo simplificar.';
        } catch(e) {
          simplified = 'Error de conexión con Hugging Face.';
        }
      } else {
        simplified = '📋 **Qué dice este documento:**\n\nEl documento establece los requisitos y consideraciones para una habilitación comercial en la jurisdicción del municipio, confirmando que se cumplen las normas vigentes (Simulación Demo).';
      }

      output.innerHTML = simplified.replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      result.style.display = 'block';
    }
  </script>
  <script src='js/live-clock.js'></script>
  <script src='js/chat-widget.js'></script>
  <script src='js/theme-switcher.js'></script>
</body>
</html>
