<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="img/municontrol-icon.jpg" type="image/jpeg" />
  <meta name="theme-color" content="#060b18">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapa Interactivo - Smart City</title>
  <meta name="description" content="Mapa Smart City Municipio" />
  
  <link rel="stylesheet" href="css/shared.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    .map-layout {
      position: relative;
      height: calc(100vh - 60px);
      width: 100%;
    }
    #map {
      width: 100%;
      height: 100%;
      background: #000;
    }
    /* Controls Panel */
    .controls-panel {
      position: absolute;
      top: 70px;
      left: 10px;
      z-index: 1000;
      background: rgba(10,22,40,0.95);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      padding: 16px;
      width: 220px;
      backdrop-filter: blur(20px);
    }
    .controls-title {
      font-weight: 800;
      font-size: 13px;
      margin-bottom: 12px;
      color: #f0f4ff;
    }
    .layer-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      color: var(--text-secondary);
      font-size: 13px;
      cursor: pointer;
    }
    .layer-toggle input {
      accent-color: #3b82f6;
    }
    /* Bottom Stats Bar */
    .stats-bar {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(10,22,40,0.95);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 99px;
      padding: 12px 24px;
      display: flex;
      gap: 24px;
      backdrop-filter: blur(20px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .stat-item {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #f0f4ff;
      font-weight: 600;
      font-size: 14px;
    }
    .stat-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    .leaflet-popup-content-wrapper {
      background: #0f172a;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
    }
    .leaflet-popup-tip {
      background: #0f172a;
    }
  </style>
</head>
<body>
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-content" id="mainContent">
    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-btn" id="menuBtn">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
        <div class="page-title">
          <h1>Mapa Smart City</h1>
        </div>
      </div>
    </header>
    
    <div class="map-layout">
      <div id="map"></div>
      
      <div class="controls-panel">
        <div class="controls-title">Capas del mapa</div>
        <label class="layer-toggle">
          <input type="checkbox" id="toggleObras" checked> Obras Activas
        </label>
        <label class="layer-toggle">
          <input type="checkbox" id="toggleReclamos" checked> Reclamos
        </label>
        <label class="layer-toggle">
          <input type="checkbox" id="toggleServicios" checked> Servicios
        </label>
      </div>

      <div class="stats-bar">
        <div class="stat-item">
          <div class="stat-dot" style="background:#f59e0b"></div>
          <span id="statObras">0</span> obras
        </div>
        <div class="stat-item">
          <div class="stat-dot" style="background:#ef4444"></div>
          <span id="statReclamos">0</span> reclamos
        </div>
        <div class="stat-item">
          <div class="stat-dot" style="background:#3b82f6"></div>
          <span id="statServicios">0</span> servicios
        </div>
      </div>
    </div>
  </div>

  <script src="js/nav.js"></script>
  <script src="js/db.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    buildSidebar('mapa');
    
    const map = L.map('map').setView([-34.5868, -60.9433], 14);
    
    L.tileLayer('https://cartodb-basemaps-{s}.global.ssl.fastly.net/dark_all/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
    }).addTo(map);

    const obrasLayer = L.layerGroup().addTo(map);
    const reclamosLayer = L.layerGroup().addTo(map);
    const serviciosLayer = L.layerGroup().addTo(map);

    let statObras = 0, statReclamos = 0, statServicios = 0;

    function initLayers() {
      // Obras
      const obras = MuniDB.getAll('obras');
      obras.forEach(function(o) {
        if(o.estado === 'finalizada') return; // Only active obras according to KPI? Let's show all but colored.
        var color = o.estado === 'en_ejecucion' ? '#f59e0b' : o.estado === 'finalizada' ? '#10b981' : '#3b82f6';
        if(o.estado !== 'finalizada') statObras++;
        L.circleMarker([o.lat || (-34.58 + Math.random()*0.05), o.lng || (-60.94 + Math.random()*0.05)], {
          radius: 10, color: color, fillColor: color, fillOpacity: 0.7, weight: 2
        }).bindPopup('<b>' + o.nombre + '</b><br>Estado: ' + o.estado + '<br>Avance: ' + (o.avance||0) + '%').addTo(obrasLayer);
      });

      // Reclamos (pendientes = red, resueltos = green)
      const reclamos = MuniDB.getAll('reclamos') || [];
      const pendingReclamos = reclamos.filter(r => r.estado !== 'resuelto');
      // Dummy reclamos if empty
      const dummyReclamos = [
        {lat: -34.581, lng: -60.942, estado: 'pendiente', titulo: 'Bache'},
        {lat: -34.588, lng: -60.945, estado: 'resuelto', titulo: 'Luz rota'},
        {lat: -34.590, lng: -60.940, estado: 'pendiente', titulo: 'Basura'}
      ];
      const allReclamos = reclamos.length ? reclamos : dummyReclamos;
      
      allReclamos.forEach(r => {
        if(r.estado === 'pendiente' || r.estado === 'en_proceso') {
          statReclamos++;
          L.circleMarker([r.lat, r.lng], {
            radius: 8, color: '#ef4444', fillColor: '#ef4444', fillOpacity: 0.8
          }).bindPopup('<b>Reclamo</b><br>' + (r.titulo || 'Pendiente')).addTo(reclamosLayer);
        } else if(r.estado === 'resuelto') {
          L.circleMarker([r.lat, r.lng], {
            radius: 8, color: '#10b981', fillColor: '#10b981', fillOpacity: 0.8
          }).bindPopup('<b>Reclamo</b><br>' + (r.titulo || 'Resuelto')).addTo(reclamosLayer);
        }
      });

      // Servicios
      const servicios = [
        { name: 'Municipalidad', lat: -34.5868, lng: -60.9433, tipo: 'gobierno' },
        { name: 'Hospital Municipal', lat: -34.5820, lng: -60.9480, tipo: 'salud' },
        { name: 'Polideportivo Sur', lat: -34.5900, lng: -60.9390, tipo: 'deporte' },
        { name: 'Terminal de Omnibus', lat: -34.5850, lng: -60.9510, tipo: 'transporte' },
        { name: 'Biblioteca Municipal', lat: -34.5830, lng: -60.9400, tipo: 'cultura' },
        { name: 'Cementerio Municipal', lat: -34.5950, lng: -60.9350, tipo: 'servicios' },
      ];
      servicios.forEach(s => {
        statServicios++;
        L.circleMarker([s.lat, s.lng], {
          radius: 8, color: '#3b82f6', fillColor: '#3b82f6', fillOpacity: 0.8, weight:2
        }).bindPopup('<b>' + s.name + '</b><br>Tipo: ' + s.tipo).addTo(serviciosLayer);
      });

      document.getElementById('statObras').innerText = statObras;
      document.getElementById('statReclamos').innerText = statReclamos;
      document.getElementById('statServicios').innerText = statServicios;
    }

    initLayers();

    // Toggle logic
    document.getElementById('toggleObras').addEventListener('change', (e) => {
      e.target.checked ? map.addLayer(obrasLayer) : map.removeLayer(obrasLayer);
    });
    document.getElementById('toggleReclamos').addEventListener('change', (e) => {
      e.target.checked ? map.addLayer(reclamosLayer) : map.removeLayer(reclamosLayer);
    });
    document.getElementById('toggleServicios').addEventListener('change', (e) => {
      e.target.checked ? map.addLayer(serviciosLayer) : map.removeLayer(serviciosLayer);
    });
  </script>
</body>
</html>
