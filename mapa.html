<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#060b18">
  <title>Mapa Smart City | MuniControl Junín</title>
  <link rel="icon" href="favicon.ico">
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;700;900&display=swap" rel="stylesheet">
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  
  <link rel="stylesheet" href="css/dashboard.css">

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #060b18;
      font-family: 'Inter', sans-serif;
    }

    /* Layout Container */
    .map-container {
      position: fixed;
      top: 0;
      left: var(--sidebar-w, 260px);
      right: 0;
      bottom: 0;
      display: flex;
      transition: left 0.28s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    body.sidebar-collapsed .map-container {
      left: 64px;
    }

    /* Control Panel (Left Sidebar inside Map) */
    .map-panel {
      width: 280px;
      min-width: 280px;
      background: rgba(10, 16, 31, 0.95);
      backdrop-filter: blur(16px);
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      z-index: 1000;
      box-shadow: 5px 0 25px rgba(0,0,0,0.5);
    }

    .panel-header {
      padding: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.02);
    }

    .panel-header h2 {
      font-family: 'Outfit', sans-serif;
      font-size: 18px;
      font-weight: 900;
      color: #f0f4ff;
      margin: 0 0 4px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .panel-header p {
      margin: 0;
      font-size: 12px;
      color: rgba(148, 163, 184, 0.6);
    }

    .panel-section {
      padding: 16px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .section-title {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: rgba(148, 163, 184, 0.5);
      margin-bottom: 12px;
    }

    /* Layer Options */
    .layer-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .layer-item:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.12);
    }

    .layer-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .layer-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .layer-title {
      font-size: 13px;
      font-weight: 600;
      color: #f0f4ff;
    }

    .layer-badge {
      font-size: 11px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.08);
      color: rgba(240, 244, 255, 0.8);
    }

    /* Search Box */
    .search-box {
      position: relative;
    }

    .search-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 10px 14px;
      color: #ffffff;
      font-size: 13px;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: #3b82f6;
    }

    /* Stats Grid */
    .stats-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .stat-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: rgba(148, 163, 184, 0.7);
    }

    .stat-value {
      font-weight: 800;
      font-size: 13px;
    }

    /* Leaflet Map Canvas */
    #map {
      flex: 1;
      height: 100%;
      width: 100%;
      background: #060b18;
    }

    /* Custom Leaflet Styling */
    .leaflet-popup-content-wrapper {
      background: #0d1526 !important;
      color: #f0f4ff !important;
      border: 1px solid rgba(255, 255, 255, 0.15) !important;
      border-radius: 14px !important;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6) !important;
    }
    .leaflet-popup-tip {
      background: #0d1526 !important;
    }

    /* Marker drop-in animation */
    @keyframes markerDrop {
      from { opacity: 0; transform: translateY(-18px) scale(0.4); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .map-marker { animation: markerDrop 0.45s cubic-bezier(0.34,1.56,0.64,1) both; }

    /* Mini toast para el mapa */
    #mapToast {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-20px);
      background: rgba(13,21,38,0.96); color: #f0f4ff; padding: 12px 20px;
      border: 1px solid rgba(59,130,246,0.35); border-radius: 12px; font-size: 13px;
      font-weight: 600; z-index: 2000; opacity: 0; pointer-events: none;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
      transition: all 0.35s cubic-bezier(0.34,1.56,0.64,1);
    }
    #mapToast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* Mobile Adaptations */
    @media (max-width: 768px) {
      .map-container {
        left: 0 !important;
        flex-direction: column-reverse;
      }
      .map-panel {
        width: 100% !important;
        min-width: 100% !important;
        height: 240px;
        flex: none;
      }
      #map {
        height: calc(100vh - 240px);
      }
    }
  </style>
</head>
<body>

  <!-- Sidebar Component -->
  <aside class="sidebar" id="sidebar"></aside>

  <!-- Map Wrapper -->
  <div class="map-container" id="mapContainer">
    
    <!-- Control Panel -->
    <div class="map-panel">
      <div class="panel-header">
        <h2>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2.5"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
          Mapa Smart City
        </h2>
        <p>Municipio de Junín, Mendoza</p>
      </div>

      <!-- Capas de Información -->
      <div class="panel-section">
        <div class="section-title">Capas Interactivas</div>
        
        <label class="layer-item">
          <div class="layer-left">
            <input type="checkbox" id="layerObras" checked onchange="toggleLayer('obras', this.checked)">
            <span class="layer-dot" style="background:#f59e0b; box-shadow: 0 0 8px #f59e0b"></span>
            <span class="layer-title">Obras Públicas</span>
          </div>
          <span class="layer-badge" id="countObras">8</span>
        </label>

        <label class="layer-item">
          <div class="layer-left">
            <input type="checkbox" id="layerReclamos" checked onchange="toggleLayer('reclamos', this.checked)">
            <span class="layer-dot" style="background:#ef4444; box-shadow: 0 0 8px #ef4444"></span>
            <span class="layer-title">Reclamos 311</span>
          </div>
          <span class="layer-badge" id="countReclamos">12</span>
        </label>

        <label class="layer-item">
          <div class="layer-left">
            <input type="checkbox" id="layerServicios" checked onchange="toggleLayer('servicios', this.checked)">
            <span class="layer-dot" style="background:#3b82f6; box-shadow: 0 0 8px #3b82f6"></span>
            <span class="layer-title">Servicios / Edificios</span>
          </div>
          <span class="layer-badge" id="countServicios">10</span>
        </label>
      </div>

      <!-- Buscador -->
      <div class="panel-section">
        <div class="section-title">Búsqueda Territorial</div>
        <div class="search-box">
          <input type="text" id="searchInput" class="search-input" placeholder="Buscar calle o barrio..." onkeydown="if(event.key==='Enter') searchLocation(this.value)">
        </div>
      </div>

      <!-- Estadísticas Rápidas -->
      <div class="panel-section" style="flex:1; border-bottom:none">
        <div class="section-title">Resumen Urbano</div>
        <div class="stats-container">
          <div class="stat-card">
            <span>Obras en Ejecución</span>
            <span class="stat-value" data-count="6" data-currency="false" style="color:#f59e0b">6</span>
          </div>
          <div class="stat-card">
            <span>Reclamos Pendientes</span>
            <span class="stat-value" data-count="5" data-currency="false" style="color:#ef4444">5</span>
          </div>
          <div class="stat-card">
            <span>SLA Cumplimiento 311</span>
            <span class="stat-value" data-count="94" data-suffix="%" data-currency="false" style="color:#10b981">94%</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Map Canvas -->
    <div id="map"></div>

  </div>

  <script src="js/theme-switcher.js"></script>
  <script src="js/nav.js"></script>
  <script>
    if (typeof buildSidebar === 'function') buildSidebar('mapa');

    // Coordenadas Junín, Mendoza (-33.1283, -69.0042)
    var JUNIN_CENTER = [-33.1283, -69.0042];
    var map;

    // Datos de Obras Públicas
    var OBRAS = [
      { id: 'O01', nombre: 'Repavimentación Av. San Martín', avance: 82, estado: 'En ejecución', lat: -33.1265, lng: -69.0031 },
      { id: 'O02', nombre: 'Red de Agua Potable Barrio Norte', avance: 45, estado: 'En ejecución', lat: -33.1240, lng: -69.0058 },
      { id: 'O03', nombre: 'Recambio LED Parque Retamo', avance: 95, estado: 'Finalizada', lat: -33.1283, lng: -69.0042 },
      { id: 'O04', nombre: 'Playón Deportivo Barrio Sur', avance: 30, estado: 'En ejecución', lat: -33.1320, lng: -69.0060 },
      { id: 'O05', nombre: 'Bacheo y Asfalto Zona Centro', avance: 65, estado: 'En ejecución', lat: -33.1300, lng: -69.0015 },
      { id: 'O06', nombre: 'Parque Lineal Av. Mitre', avance: 50, estado: 'En ejecución', lat: -33.1350, lng: -69.0080 }
    ];

    // Datos de Reclamos 311
    var RECLAMOS = [
      { id: 'R01', tipo: 'Bache en calzada', estado: 'Pendiente', barrio: 'Centro', lat: -33.1275, lng: -69.0038 },
      { id: 'R02', tipo: 'Luminaria apagada', estado: 'En proceso', barrio: 'Norte', lat: -33.1248, lng: -69.0062 },
      { id: 'R03', tipo: 'Pérdida de agua', estado: 'En proceso', barrio: 'Oeste', lat: -33.1305, lng: -69.0075 },
      { id: 'R04', tipo: 'Residuos no recolectados', estado: 'Pendiente', barrio: 'Sur', lat: -33.1335, lng: -69.0028 },
      { id: 'R05', tipo: 'Arbolado enfermo', estado: 'Pendiente', barrio: 'Centro', lat: -33.1288, lng: -69.0022 }
    ];

    // Servicios Municipales
    var SERVICIOS = [
      { nombre: 'Municipalidad de Junín', tipo: 'Edificio Central', lat: -33.1283, lng: -69.0042 },
      { nombre: 'Hospital Las Heras', tipo: 'Salud', lat: -33.1270, lng: -69.0015 },
      { nombre: 'Polideportivo Municipal', tipo: 'Deportes', lat: -33.1330, lng: -69.0090 },
      { nombre: 'Terminal de Ómnibus', tipo: 'Transporte', lat: -33.1310, lng: -68.9985 }
    ];

    var layerGroups = {
      obras: L.layerGroup(),
      reclamos: L.layerGroup(),
      servicios: L.layerGroup()
    };

    function createCustomMarker(color, label) {
      return L.divIcon({
        className: 'map-marker',
        html: `<div style="width:28px;height:28px;background:${color};border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid white;box-shadow:0 0 12px ${color};display:flex;align-items:center;justify-content:center"><span style="transform:rotate(45deg);color:white;font-size:10px;font-weight:900">${label}</span></div>`,
        iconSize: [28, 28],
        iconAnchor: [14, 28]
      });
    }

    function initMap() {
      map = L.map('map', { zoomControl: false }).setView(JUNIN_CENTER, 15);

      // CartoDB Dark Matter tiles + Fallback
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap &copy; CARTO'
      }).addTo(map);

      L.control.zoom({ position: 'topright' }).addTo(map);

      // Cargar Capa Obras
      OBRAS.forEach(o => {
        L.marker([o.lat, o.lng], { icon: createCustomMarker('#f59e0b', '🏗️') })
          .bindPopup(`
            <div style="padding:4px">
              <strong style="font-size:14px;color:#60a5fa">${o.nombre}</strong><br>
              <span style="font-size:12px;color:#cbd5e1">Estado: ${o.estado}</span><br>
              <div style="background:rgba(255,255,255,0.1);border-radius:4px;height:6px;margin-top:8px;overflow:hidden">
                <div style="background:#f59e0b;width:${o.avance}%;height:100%"></div>
              </div>
              <span style="font-size:10px;color:#94a3b8;float:right;margin-top:2px">${o.avance}% completado</span>
            </div>
          `)
          .addTo(layerGroups.obras);
      });

      // Cargar Capa Reclamos
      RECLAMOS.forEach(r => {
        L.marker([r.lat, r.lng], { icon: createCustomMarker('#ef4444', '🚨') })
          .bindPopup(`
            <div style="padding:4px">
              <strong style="font-size:14px;color:#f87171">${r.tipo}</strong><br>
              <span style="font-size:12px;color:#cbd5e1">Barrio: ${r.barrio}</span><br>
              <span style="font-size:11px;font-weight:700;color:#f59e0b">Estado: ${r.estado}</span>
            </div>
          `)
          .addTo(layerGroups.reclamos);
      });

      // Cargar Capa Servicios
      SERVICIOS.forEach(s => {
        L.marker([s.lat, s.lng], { icon: createCustomMarker('#3b82f6', '🏛️') })
          .bindPopup(`
            <div style="padding:4px">
              <strong style="font-size:14px;color:#34d399">${s.nombre}</strong><br>
              <span style="font-size:12px;color:#cbd5e1">${s.tipo}</span>
            </div>
          `)
          .addTo(layerGroups.servicios);
      });

      // Activar todas las capas
      Object.values(layerGroups).forEach(lg => lg.addTo(map));

      // Ajustar mapa
      setTimeout(() => { map.invalidateSize(); }, 300);
    }

    function toggleLayer(name, visible) {
      if (visible) map.addLayer(layerGroups[name]);
      else map.removeLayer(layerGroups[name]);
    }

    function showMapToast(msg) {
      let t = document.getElementById('mapToast');
      if (!t) { t = document.createElement('div'); t.id = 'mapToast'; document.body.appendChild(t); }
      t.textContent = msg; t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2400);
    }

    function searchLocation(query) {
      if (!query) return;
      fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query + ', Junín, Mendoza, Argentina')}&format=json&limit=1`)
        .then(res => res.json())
        .then(data => {
          if (data && data.length > 0) {
            map.setView([parseFloat(data[0].lat), parseFloat(data[0].lon)], 17);
          } else {
            showMapToast("No se encontró la ubicación en Junín.");
          }
        });
    }

    document.addEventListener('DOMContentLoaded', initMap);
  </script>
<script src='js/motion-kit.js'></script>
  </body>
</html>
