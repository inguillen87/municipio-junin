<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa - Junín</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0f172a;
      color: #f8fafc;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }
    .leaflet-popup-content-wrapper {
      background: #ffffff;
      color: #1e293b;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }
    .leaflet-popup-tip {
      background: #ffffff;
    }
    .leaflet-popup-content {
      margin: 12px;
    }
  </style>
</head>
<body>

  <!-- Sidebar Container (handled by nav.js) -->
  <div id="sidebar"></div>

  <!-- Main Content Wrapper -->
  <div id="mainContent" style="position:absolute;top:0;left:0;right:0;bottom:0">;top:0;left:60px;right:0;bottom:0;display:flex">
    
    <!-- Left panel controls -->
    <div id="mapPanel" style="width:240px;background:rgba(6,11,24,0.95);border-right:1px solid rgba(255,255,255,0.07);z-index:1000;display:flex;flex-direction:column;overflow:hidden">
      
      <!-- Topbar passthrough -->
      <div style="padding:14px 16px;border-bottom:1px solid rgba(255,255,255,0.06)">
        <div style="font-family:'Outfit',sans-serif;font-size:16px;font-weight:900;color:#f0f4ff">Mapa Smart City</div>
        <div style="font-size:11px;color:rgba(148,163,184,0.5)">Municipio de Junin</div>
      </div>
      
      <!-- Layer toggles -->
      <div style="padding:14px 16px;border-bottom:1px solid rgba(255,255,255,0.06)">
        <div style="font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:0.5px;color:rgba(148,163,184,0.4);margin-bottom:10px">Capas</div>
        
        <label style="display:flex;align-items:center;gap:10px;cursor:pointer;margin-bottom:8px">
          <input type="checkbox" id="layerObras" checked onchange="toggleLayer('obras',this.checked)" style="accent-color:#f59e0b;width:16px;height:16px">
          <span style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:#fbbf24">
            <span style="width:10px;height:10px;background:#f59e0b;border-radius:50%;flex-shrink:0"></span>
            Obras activas
          </span>
          <span id="countObras" style="margin-left:auto;font-size:11px;font-weight:700;color:rgba(148,163,184,0.5)">0</span>
        </label>
        
        <label style="display:flex;align-items:center;gap:10px;cursor:pointer;margin-bottom:8px">
          <input type="checkbox" id="layerReclamos" checked onchange="toggleLayer('reclamos',this.checked)" style="accent-color:#ef4444;width:16px;height:16px">
          <span style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:#f87171">
            <span style="width:10px;height:10px;background:#ef4444;border-radius:50%;flex-shrink:0"></span>
            Reclamos
          </span>
          <span id="countReclamos" style="margin-left:auto;font-size:11px;font-weight:700;color:rgba(148,163,184,0.5)">0</span>
        </label>
        
        <label style="display:flex;align-items:center;gap:10px;cursor:pointer">
          <input type="checkbox" id="layerServicios" checked onchange="toggleLayer('servicios',this.checked)" style="accent-color:#3b82f6;width:16px;height:16px">
          <span style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:#60a5fa">
            <span style="width:10px;height:10px;background:#3b82f6;border-radius:50%;flex-shrink:0"></span>
            Servicios
          </span>
          <span id="countServicios" style="margin-left:auto;font-size:11px;font-weight:700;color:rgba(148,163,184,0.5)">0</span>
        </label>
      </div>
      
      <!-- Filter reclamos by estado -->
      <div style="padding:14px 16px;border-bottom:1px solid rgba(255,255,255,0.06)">
        <div style="font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:0.5px;color:rgba(148,163,184,0.4);margin-bottom:10px">Filtrar reclamos</div>
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;margin-bottom:6px;font-size:12px;color:rgba(148,163,184,0.7)">
          <input type="radio" name="recFilter" value="todos" checked onchange="filterReclamos(this.value)"> Todos
        </label>
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;margin-bottom:6px;font-size:12px;color:#f87171">
          <input type="radio" name="recFilter" value="pendiente" onchange="filterReclamos(this.value)"> Solo pendientes
        </label>
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;color:#fbbf24">
          <input type="radio" name="recFilter" value="en_proceso" onchange="filterReclamos(this.value)"> En proceso
        </label>
      </div>
      
      <!-- Quick stats -->
      <div style="padding:14px 16px;flex:1">
        <div style="font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:0.5px;color:rgba(148,163,184,0.4);margin-bottom:10px">Resumen</div>
        <div id="mapStats" style="display:flex;flex-direction:column;gap:8px"></div>
      </div>
      
      <!-- Address search -->
      <div style="padding:14px 16px;border-top:1px solid rgba(255,255,255,0.06)">
        <input type="text" id="addressSearch" placeholder="Buscar calle..." 
          style="width:100%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:8px 12px;color:#f0f4ff;font-size:12px;font-family:'Inter',sans-serif;outline:none;box-sizing:border-box"
          onkeydown="if(event.key==='Enter')searchAddress(this.value)">
      </div>
    </div>

    <!-- Map area (to the right of the panel) -->
    <div id="map" style="flex:1;position:relative;"></div>
  </div>

  <script src="db.js"></script>
  <script src="nav.js"></script>
  <script>
    if (typeof buildSidebar === 'function') {
      buildSidebar('mapa');
    }

    // OBRAS (with real Junin coordinates)
    var OBRAS_DATA = [
      {id:'O001',nombre:'Pavimentacion Av. San Martin 2300-2800',estado:'en_ejecucion',avance:45,monto:'$85M',contratista:'Constructora Sur SA',lat:-34.5868,lng:-60.9433},
      {id:'O002',nombre:'Recoleccion Residuos Zona Norte',estado:'en_ejecucion',avance:78,monto:'$42M',contratista:'Servicios Municipales SRL',lat:-34.5780,lng:-60.9380},
      {id:'O003',nombre:'Iluminacion LED Parque Municipal',estado:'finalizada',avance:100,monto:'$18.7M',contratista:'ElectroMunicipal SA',lat:-34.5910,lng:-60.9510},
      {id:'O004',nombre:'Playón Deportivo Barrio Sur',estado:'en_ejecucion',avance:32,monto:'$22.4M',contratista:'Obras y Servicios SRL',lat:-34.5950,lng:-60.9460},
      {id:'O005',nombre:'Red Vial Urbana y Rural',estado:'en_ejecucion',avance:58,monto:'$61M',contratista:'Vial Argentina SA',lat:-34.5820,lng:-60.9550},
      {id:'O006',nombre:'Centro de Salud Barrio Norte',estado:'planificada',avance:0,monto:'$34M',contratista:'Pendiente',lat:-34.5770,lng:-60.9400},
      {id:'O007',nombre:'Parque Lineal Laguna de Gomez',estado:'en_ejecucion',avance:71,monto:'$15M',contratista:'Verde Urbano SA',lat:-34.5680,lng:-60.9300},
      {id:'O008',nombre:'Renovacion Red Cloacal Centro',estado:'en_ejecucion',avance:24,monto:'$48M',contratista:'AguasMunicipales',lat:-34.5855,lng:-60.9460},
    ];

    // RECLAMOS (pendientes/en proceso con coords)
    var RECLAMOS_DATA = [
      {id:'R001',tipo:'Bache en calzada',estado:'pendiente',prioridad:'alta',barrio:'Centro',lat:-34.5862,lng:-60.9421},
      {id:'R002',tipo:'Luminaria apagada',estado:'en_proceso',prioridad:'media',barrio:'Belgrano',lat:-34.5890,lng:-60.9445},
      {id:'R003',tipo:'Perdida de agua',estado:'en_proceso',prioridad:'alta',barrio:'Moreno',lat:-34.5845,lng:-60.9480},
      {id:'R004',tipo:'Residuos no recolectados',estado:'pendiente',prioridad:'media',barrio:'Norte',lat:-34.5790,lng:-60.9410},
      {id:'R005',tipo:'Arbol caido',estado:'resuelto',prioridad:'alta',barrio:'Italia',lat:-34.5870,lng:-60.9395},
      {id:'R006',tipo:'Bache en calzada',estado:'pendiente',prioridad:'media',barrio:'Centro',lat:-34.5880,lng:-60.9430},
      {id:'R007',tipo:'Semaforo roto',estado:'pendiente',prioridad:'alta',barrio:'Centro',lat:-34.5858,lng:-60.9440},
      {id:'R008',tipo:'Perdida de gas',estado:'en_proceso',prioridad:'alta',barrio:'Alem',lat:-34.5830,lng:-60.9455},
      {id:'R009',tipo:'Basural clandestino',estado:'en_proceso',prioridad:'baja',barrio:'Sur',lat:-34.5930,lng:-60.9420},
      {id:'R010',tipo:'Luminaria apagada',estado:'resuelto',prioridad:'media',barrio:'Belgrano',lat:-34.5900,lng:-60.9465},
      {id:'R011',tipo:'Bache en calzada',estado:'pendiente',prioridad:'alta',barrio:'Rivadavia',lat:-34.5840,lng:-60.9395},
      {id:'R012',tipo:'Arbolado enfermo',estado:'pendiente',prioridad:'baja',barrio:'Parque',lat:-34.5915,lng:-60.9490},
    ];

    // SERVICIOS MUNICIPALES (key locations)
    var SERVICIOS_DATA = [
      {nombre:'Municipalidad de Junin',tipo:'gobierno',lat:-34.5868,lng:-60.9433,tel:'(0236) 4XX-XXXX',horario:'Lun-Vie 7:30-14:30'},
      {nombre:'Hospital Municipal Domingo Gateno',tipo:'salud',lat:-34.5820,lng:-60.9480,tel:'(0236) 4XX-XXXX',horario:'24 horas'},
      {nombre:'Terminal de Omnibus',tipo:'transporte',lat:-34.5850,lng:-60.9510,tel:'(0236) 4XX-XXXX',horario:'5:00-23:00'},
      {nombre:'Biblioteca Municipal',tipo:'cultura',lat:-34.5830,lng:-60.9400,tel:'(0236) 4XX-XXXX',horario:'Lun-Vie 8-20'},
      {nombre:'Polideportivo Municipal Sur',tipo:'deporte',lat:-34.5950,lng:-60.9390,tel:'(0236) 4XX-XXXX',horario:'7:00-22:00'},
      {nombre:'Centro de Jubilados',tipo:'social',lat:-34.5875,lng:-60.9415,tel:'(0236) 4XX-XXXX',horario:'Lun-Vie 9-17'},
      {nombre:'Cementerio Municipal',tipo:'servicios',lat:-34.5960,lng:-60.9350,tel:'(0236) 4XX-XXXX',horario:'8:00-18:00'},
      {nombre:'Guarderia Municipal',tipo:'social',lat:-34.5810,lng:-60.9440,tel:'(0236) 4XX-XXXX',horario:'7:30-17:30'},
      {nombre:'Estadio Ciudad de Junin',tipo:'deporte',lat:-34.5770,lng:-60.9500,tel:'(0236) 4XX-XXXX',horario:'Eventos'},
      {nombre:'Delegacion Barrio Norte',tipo:'gobierno',lat:-34.5760,lng:-60.9380,tel:'(0236) 4XX-XXXX',horario:'Lun-Vie 8-14'},
    ];

    function makeIcon(color, label) {
      return L.divIcon({
        className: '',
        html: '<div style="width:32px;height:32px;background:'+color+';border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid rgba(255,255,255,0.3);box-shadow:0 2px 8px rgba(0,0,0,0.4)"><div style="transform:rotate(45deg);display:flex;align-items:center;justify-content:center;height:100%;font-size:9px;font-weight:800;color:white">'+label+'</div></div>',
        iconSize: [32,32],
        iconAnchor: [16,32],
        popupAnchor: [0,-32]
      });
    }

    var obraIcon    = makeIcon('#f59e0b','O');
    var recPendIcon = makeIcon('#ef4444','!');
    var recProcIcon = makeIcon('#f59e0b','~');
    var recResIcon  = makeIcon('#10b981','v');
    var servIcon    = makeIcon('#3b82f6','S');

    function obraPopup(o) {
      return '<div style="font-family:Inter,sans-serif;min-width:220px">' +
        '<div style="font-size:13px;font-weight:700;margin-bottom:8px;color:#1e293b">' + o.nombre + '</div>' +
        '<div style="font-size:12px;margin-bottom:4px">Estado: <strong>' + o.estado + '</strong></div>' +
        '<div style="font-size:12px;margin-bottom:4px">Contratista: ' + o.contratista + '</div>' +
        '<div style="font-size:12px;margin-bottom:8px">Monto: <strong>' + o.monto + '</strong></div>' +
        '<div style="background:#f1f5f9;border-radius:4px;height:8px;overflow:hidden">' +
        '<div style="height:100%;background:' + (o.avance>=70?'#10b981':o.avance>=40?'#f59e0b':'#ef4444') + ';width:'+o.avance+'%"></div></div>' +
        '<div style="font-size:11px;text-align:right;margin-top:4px">' + o.avance + '% completado</div>' +
        '</div>';
    }

    var map;
    var layers = { obras: L.layerGroup(), reclamos: L.layerGroup(), servicios: L.layerGroup() };

    function toggleLayer(name, visible) {
      if (visible) { map.addLayer(layers[name]); }
      else { map.removeLayer(layers[name]); }
    }

    function filterReclamos(estado) {
      layers.reclamos.clearLayers();
      var data = RECLAMOS_DATA;
      if (window.MuniDB) { 
        try { 
          var d = MuniDB.getAll('reclamos'); 
          if(d && d.length) {
            // merge coords if available, otherwise just use mock
            data = d; 
          }
        } catch(e){} 
      }
      data.forEach(function(r){
        if (estado !== 'todos' && r.estado !== estado) return;
        var icon = r.estado==='resuelto' ? recResIcon : r.estado==='en_proceso' ? recProcIcon : recPendIcon;
        var m = L.marker([r.lat||(-34.585+Math.random()*0.02), r.lng||(-60.943+Math.random()*0.02)], {icon:icon})
          .bindPopup('<div style="font-family:Inter,sans-serif;color:#1e293b"><div style="font-size:13px;font-weight:700;margin-bottom:4px">'+(r.tipo||r.asunto)+'</div><div style="font-size:12px;margin-bottom:2px">Estado: <strong>'+r.estado+'</strong></div><div style="font-size:12px;margin-bottom:2px">Barrio: '+(r.barrio||'')+'</div><div style="font-size:11px;color:#64748b">ID: '+(r.id||'')+'</div></div>');
        layers.reclamos.addLayer(m);
      });
    }

    function updateStats() {
      var pendRec = RECLAMOS_DATA.filter(function(r){return r.estado==='pendiente';}).length;
      var obrasEjec = OBRAS_DATA.filter(function(o){return o.estado==='en_ejecucion';}).length;
      document.getElementById('mapStats').innerHTML = [
        statRow('Obras en ejecucion', obrasEjec, '#f59e0b'),
        statRow('Reclamos pendientes', pendRec, '#ef4444'),
        statRow('Servicios mapeados', SERVICIOS_DATA.length, '#3b82f6'),
        statRow('Avance prom. obras', Math.round(OBRAS_DATA.reduce(function(s,o){return s+o.avance;},0)/OBRAS_DATA.length)+'%', '#10b981'),
      ].join('');
      document.getElementById('countObras').textContent = OBRAS_DATA.length;
      document.getElementById('countReclamos').textContent = RECLAMOS_DATA.length;
      document.getElementById('countServicios').textContent = SERVICIOS_DATA.length;
    }
    
    function statRow(label, val, color) {
      return '<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.04)"><span style="font-size:12px;color:rgba(148,163,184,0.6)">'+label+'</span><span style="font-size:13px;font-weight:800;color:'+color+'">'+val+'</span></div>';
    }

    function searchAddress(val) {
      if(!val) return;
      alert("Búsqueda simulada de: " + val);
    }

    document.addEventListener('DOMContentLoaded', function() {
      map = L.map('map', {zoomControl:false}).setView([-34.5868,-60.9433], 14);
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{
        attribution:'&copy; OpenStreetMap &copy; CARTO', subdomains:'abcd', maxZoom:19
      }).addTo(map);
      L.control.zoom({position:'topright'}).addTo(map);
      
      // Add all layers to map
      layers.obras.addTo(map);
      layers.reclamos.addTo(map);
      layers.servicios.addTo(map);
      
      // Populate obras layer
      OBRAS_DATA.forEach(function(o){
        L.marker([o.lat,o.lng],{icon:obraIcon}).bindPopup(obraPopup(o)).addTo(layers.obras);
      });
      
      // Populate reclamos
      filterReclamos('todos');
      
      // Populate servicios
      SERVICIOS_DATA.forEach(function(s){
        L.marker([s.lat,s.lng],{icon:servIcon})
          .bindPopup('<div style="font-family:Inter,sans-serif;color:#1e293b"><div style="font-size:13px;font-weight:700;margin-bottom:4px">'+s.nombre+'</div><div style="font-size:12px;margin-bottom:2px">Tipo: <strong>'+s.tipo+'</strong></div><div style="font-size:12px;margin-bottom:2px">Horario: '+s.horario+'</div><div style="font-size:12px">Tel: '+s.tel+'</div></div>')
          .addTo(layers.servicios);
      });
      
      updateStats();
    });
  </script>
</body>
</html>
