<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="img/municontrol-icon.jpg" type="image/jpeg" />
  <meta name='theme-color' content='#060b18'>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapa Financiero — MuniControl</title>
  <meta name="description" content="Mapa georreferenciado de gastos, costos y obras públicas municipales" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src='js/db.js'></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="css/shared.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <style>
    .map-layout {
      display: flex;
      height: calc(100vh - 64px);
      overflow: hidden;
    }
    .map-sidebar {
      width: 320px;
      flex-shrink: 0;
      background: var(--bg-surface);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .map-sidebar-section {
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }
    .map-sidebar-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }
    .map-container {
      flex: 1;
      position: relative;
    }
    #map {
      width: 100%;
      height: 100%;
      background: #0d1526;
    }
    /* Dark map tiles */
    .leaflet-layer,
    .leaflet-control-zoom-in,
    .leaflet-control-zoom-out,
    .leaflet-control-attribution {
      filter: invert(1) hue-rotate(180deg) brightness(0.8) saturate(1.3);
    }
    /* Layer controls */
    .map-controls {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .layer-btn {
      background: rgba(9,15,28,0.92);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      backdrop-filter: blur(12px);
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 180px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    .layer-btn.active {
      border-color: rgba(59,130,246,0.5);
      color: #60a5fa;
      background: rgba(59,130,246,0.08);
    }
    .layer-btn .layer-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    /* Zone cards */
    .zone-card {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .zone-card:hover, .zone-card.selected {
      background: rgba(59,130,246,0.06);
      border-color: rgba(59,130,246,0.25);
    }
    .zone-name { font-weight: 700; font-size: 13px; color: var(--text-primary); }
    .zone-budget { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
    .zone-bar-wrap { height: 4px; background: rgba(255,255,255,0.06); border-radius: 99px; margin-top: 8px; overflow: hidden; }
    .zone-bar { height: 100%; border-radius: 99px; transition: width 1.5s ease; }
    /* Bottom KPIs */
    .map-kpis {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      z-index: 1000;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0;
      background: rgba(6,11,24,0.95);
      border-top: 1px solid var(--border);
      backdrop-filter: blur(12px);
    }
    .map-kpi {
      padding: 14px 18px;
      border-right: 1px solid var(--border);
    }
    .map-kpi:last-child { border-right: none; }
    .map-kpi-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); }
    .map-kpi-value { font-family: 'Outfit', sans-serif; font-size: 20px; font-weight: 900; color: var(--text-primary); margin-top: 3px; }
    .map-kpi-sub { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
    /* Obras popup */
    .leaflet-popup-content-wrapper {
      background: #111d35 !important;
      border: 1px solid rgba(255,255,255,0.1) !important;
      border-radius: 12px !important;
      color: #f0f4ff !important;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5) !important;
    }
    .leaflet-popup-tip { background: #111d35 !important; }
    .obra-popup { min-width: 200px; }
    .obra-popup-title { font-weight: 800; font-size: 14px; margin-bottom: 6px; }
    .obra-popup-detail { font-size: 12px; color: rgba(148,163,184,0.8); margin-bottom: 4px; }
    .obra-progress-wrap { height: 6px; background: rgba(255,255,255,0.08); border-radius: 99px; margin-top: 8px; overflow: hidden; }
    .obra-progress-bar { height: 100%; border-radius: 99px; transition: width 1s ease; }
    /* Legend */
    .map-legend {
      position: absolute;
      bottom: 90px;
      right: 16px;
      z-index: 1000;
      background: rgba(9,15,28,0.92);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      backdrop-filter: blur(12px);
      font-size: 11px;
    }
    .legend-title { font-weight: 700; color: var(--text-primary); margin-bottom: 8px; }
    .legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; color: var(--text-muted); }
    .legend-box { width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0; }
    /* Obra marker pulse */
    .obra-marker {
      width: 36px; height: 36px;
      background: rgba(245,158,11,0.9);
      border: 3px solid rgba(245,158,11,0.4);
  costosLayer.addTo(map);

  buildSidebar('mapa');
  </script>
  <script src='js/db.js'></script>
  <script src='js/ux-improvements.js'></script>
  <script src='js/db.js'></script>
  <script src='js/bottom-nav.js'></script>
</body>
</html>
