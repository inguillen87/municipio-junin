<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="img/municontrol-icon.jpg" type="image/jpeg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapa Financiero — MuniControl</title>
  <meta name="description" content="Mapa georreferenciado de gastos, costos y obras públicas municipales" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="css/shared.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <style>
    .map-layout {
      display: flex;
      height: calc(100vh - 64px);
      overflow: hidden;
    }
    .map-sidebar {
      width: 320px;
      flex-shrink: 0;
      background: var(--bg-surface);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .map-sidebar-section {
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }
    .map-sidebar-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }
    .map-container {
      flex: 1;
      position: relative;
    }
    #map {
      width: 100%;
      height: 100%;
      background: #0d1526;
    }
    /* Dark map tiles */
    .leaflet-layer,
    .leaflet-control-zoom-in,
    .leaflet-control-zoom-out,
    .leaflet-control-attribution {
      filter: invert(1) hue-rotate(180deg) brightness(0.8) saturate(1.3);
    }
    /* Layer controls */
    .map-controls {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .layer-btn {
      background: rgba(9,15,28,0.92);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      backdrop-filter: blur(12px);
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 180px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    .layer-btn.active {
      border-color: rgba(59,130,246,0.5);
      color: #60a5fa;
      background: rgba(59,130,246,0.08);
    }
    .layer-btn .layer-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    /* Zone cards */
    .zone-card {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .zone-card:hover, .zone-card.selected {
      background: rgba(59,130,246,0.06);
      border-color: rgba(59,130,246,0.25);
    }
    .zone-name { font-weight: 700; font-size: 13px; color: var(--text-primary); }
    .zone-budget { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
    .zone-bar-wrap { height: 4px; background: rgba(255,255,255,0.06); border-radius: 99px; margin-top: 8px; overflow: hidden; }
    .zone-bar { height: 100%; border-radius: 99px; transition: width 1.5s ease; }
    /* Bottom KPIs */
    .map-kpis {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      z-index: 1000;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0;
      background: rgba(6,11,24,0.95);
      border-top: 1px solid var(--border);
      backdrop-filter: blur(12px);
    }
    .map-kpi {
      padding: 14px 18px;
      border-right: 1px solid var(--border);
    }
    .map-kpi:last-child { border-right: none; }
    .map-kpi-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); }
    .map-kpi-value { font-family: 'Outfit', sans-serif; font-size: 20px; font-weight: 900; color: var(--text-primary); margin-top: 3px; }
    .map-kpi-sub { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
    /* Obras popup */
    .leaflet-popup-content-wrapper {
      background: #111d35 !important;
      border: 1px solid rgba(255,255,255,0.1) !important;
      border-radius: 12px !important;
      color: #f0f4ff !important;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5) !important;
    }
    .leaflet-popup-tip { background: #111d35 !important; }
    .obra-popup { min-width: 200px; }
    .obra-popup-title { font-weight: 800; font-size: 14px; margin-bottom: 6px; }
    .obra-popup-detail { font-size: 12px; color: rgba(148,163,184,0.8); margin-bottom: 4px; }
    .obra-progress-wrap { height: 6px; background: rgba(255,255,255,0.08); border-radius: 99px; margin-top: 8px; overflow: hidden; }
    .obra-progress-bar { height: 100%; border-radius: 99px; transition: width 1s ease; }
    /* Legend */
    .map-legend {
      position: absolute;
      bottom: 90px;
      right: 16px;
      z-index: 1000;
      background: rgba(9,15,28,0.92);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      backdrop-filter: blur(12px);
      font-size: 11px;
    }
    .legend-title { font-weight: 700; color: var(--text-primary); margin-bottom: 8px; }
    .legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; color: var(--text-muted); }
    .legend-box { width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0; }
    /* Obra marker pulse */
    .obra-marker {
      width: 36px; height: 36px;
      background: rgba(245,158,11,0.9);
      border: 3px solid rgba(245,158,11,0.4);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      box-shadow: 0 0 20px rgba(245,158,11,0.5);
      animation: markerPulse 2s ease-in-out infinite;
    }
    @keyframes markerPulse { 0%,100%{box-shadow:0 0 12px rgba(245,158,11,0.5)} 50%{box-shadow:0 0 24px rgba(245,158,11,0.8)} }
    @media (max-width: 768px) {
      .map-layout { flex-direction: column; height: auto; }
      .map-sidebar { width: 100%; max-height: 220px; flex-direction: row; overflow-x: auto; flex-wrap: nowrap; }
      .map-sidebar-section { min-width: 260px; }
      #map { height: calc(100vh - 380px); min-height: 280px; }
      .map-kpis { grid-template-columns: repeat(2,1fr); }
      .map-controls { top: 8px; right: 8px; }
      .layer-btn { min-width: 140px; padding: 8px 10px; font-size: 11px; }
    }
  </style>
</head>
<body>
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-content" id="mainContent">
    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-btn" id="menuBtn">☰</button>
        <div class="page-title">
          <h1>🗺️ Mapa Financiero</h1>
          <div class="breadcrumb">Control / Gastos por Zona</div>
        </div>
      </div>
      <div class="topbar-right">
        <select id="periodSelector" style="background:var(--bg-card);border:1px solid var(--border);color:var(--text-primary);padding:6px 12px;border-radius:6px;font-size:12px;cursor:pointer;">
          <option value="mensual">Mensual</option>
          <option value="trimestral">Trimestral</option>
          <option value="anual">Anual</option>
        </select>
        <button id="btnExportarMapa" class="btn-primary" style="font-size:12px;padding:6px 12px;margin-right:8px;">Exportar Mapa</button>
        <div id="mapStatus" style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--green)"><span style="width:8px;height:8px;background:#10b981;border-radius:50%;display:inline-block;box-shadow:0 0 8px #10b981"></span>Datos en tiempo real</div>
        <div class="topbar-avatar" id="userAvatar">JT</div>
      </div>
    </header>

    <div class="map-layout">
      <!-- SIDEBAR MAPA -->
      <div class="map-sidebar">
        <div class="map-sidebar-section">
          <div class="map-sidebar-title">📍 Zonas del Municipio</div>
          <div id="zoneList"></div>
        </div>
        <div class="map-sidebar-section">
          <div class="map-sidebar-title">🏗️ Obras en Curso</div>
          <div id="obrasList"></div>
        </div>
      </div>

      <!-- MAPA -->
      <div class="map-container">
        <div id="map"></div>

        <!-- CONTROLES DE CAPAS -->
        <div class="map-controls">
          <button class="layer-btn active" id="btnCostos" onclick="toggleLayer('costos')">
            <span class="layer-dot" style="background:#3b82f6"></span>
            💰 Costos por Zona
          </button>
          <button class="layer-btn" id="btnObras" onclick="toggleLayer('obras')">
            <span class="layer-dot" style="background:#f59e0b"></span>
            🏗️ Obras Públicas
          </button>
          <button class="layer-btn" id="btnHeatmap" onclick="toggleLayer('heatmap')">
            <span class="layer-dot" style="background:#ef4444"></span>
            🔥 Heatmap Gasto
          </button>
        </div>

        <!-- LEYENDA -->
        <div class="map-legend" id="mapLegend">
          <div class="legend-title">Gasto Mensual</div>
          <div class="legend-item"><div class="legend-box" style="background:rgba(16,185,129,0.7)"></div> Bajo (&lt; $5M)</div>
          <div class="legend-item"><div class="legend-box" style="background:rgba(245,158,11,0.7)"></div> Medio ($5M–$15M)</div>
          <div class="legend-item"><div class="legend-box" style="background:rgba(239,68,68,0.7)"></div> Alto (&gt; $15M)</div>
        </div>

        <!-- KPIs BOTTOM -->
        <div class="map-kpis">
          <div class="map-kpi">
            <div class="map-kpi-label">Presupuesto Total</div>
            <div class="map-kpi-value">$372M</div>
            <div class="map-kpi-sub">Anual 2026</div>
          </div>
          <div class="map-kpi">
            <div class="map-kpi-label">Ejecutado</div>
            <div class="map-kpi-value" style="color:#10b981">$193M</div>
            <div class="map-kpi-sub">52% del total</div>
          </div>
          <div class="map-kpi">
            <div class="map-kpi-label">Obras Activas</div>
            <div class="map-kpi-value" style="color:#f59e0b">8</div>
            <div class="map-kpi-sub">En ejecución</div>
          </div>
          <div class="map-kpi">
            <div class="map-kpi-label">Zonas Monitoreadas</div>
            <div class="map-kpi-value" style="color:#8b5cf6">12</div>
            <div class="map-kpi-sub">Cobertura 100%</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/pwa.js"></script>
  <script>try{var t=localStorage.getItem('govtech_theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
  <script>
  // Verificar sesión activa
  (function() {
    try {
      var t = localStorage.getItem('govtech_theme');
      if (t) document.documentElement.setAttribute('data-theme', t);
      var u = sessionStorage.getItem('mjunin_user');
      if (!u) { window.location.replace('login.html'); }
    } catch(e) {}
  })();
</script>
  <script src="js/nav.js"></script>
  <script src="js/toast.js"></script>
  <script>
  // ── DATOS FINANCIEROS POR ZONA ────────────────────────────
  var ZONAS = [
    { name:'Centro', lat:-34.5854, lng:-60.9433, gasto:18500000, tipo:'costos', radio:400 },
    { name:'Barrio Norte', lat:-34.5780, lng:-60.9400, gasto:12300000, tipo:'costos', radio:350 },
    { name:'Barrio Sur', lat:-34.5930, lng:-60.9450, gasto:9800000, tipo:'costos', radio:300 },
    { name:'Barrio Oeste', lat:-34.5860, lng:-60.9530, gasto:7600000, tipo:'costos', radio:280 },
    { name:'Villa del Parque', lat:-34.5810, lng:-60.9500, gasto:5400000, tipo:'costos', radio:250 },
    { name:'Av. San Martín (Pavim.)', lat:-34.5850, lng:-60.9380, gasto:42000000, tipo:'obras', estado:'En ejecución' },
    { name:'Parque Municipal (LED)', lat:-34.5890, lng:-60.9470, gasto:18700000, tipo:'obras', estado:'Terminada' },
    { name:'Playón Barrio Sur', lat:-34.5950, lng:-60.9460, gasto:22400000, tipo:'obras', estado:'En licitación' },
  ];

  // ── MAPA LEAFLET ─────────────────────────────────────────
  const map = L.map('map', { zoomControl: true }).setView([-34.5854, -60.9433], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap',
    maxZoom: 18,
  }).addTo(map);

  let multiplier = 1;
  let costosLayer = L.layerGroup();
  let obrasLayer = L.layerGroup();
  let heatmapLayer = L.layerGroup();
  
  function renderLayers() {
    costosLayer.clearLayers();
    obrasLayer.clearLayers();
    heatmapLayer.clearLayers();
    
    ZONAS.forEach(z => {
      const gastoCalc = z.gasto * multiplier;
      
      if (z.tipo === 'costos') {
        const color = gastoCalc > 15000000 ? '#ef4444' : gastoCalc > 5000000 ? '#f59e0b' : '#10b981';
        L.circle([z.lat, z.lng], {
          radius: z.radio || 300,
          color,
          fillColor: color,
          fillOpacity: 0.2,
          weight: 2,
          opacity: 0.7,
        }).bindPopup(`
          <div style="color:#f0f4ff;font-family:Inter,sans-serif;min-width:180px">
            <div style="font-weight:800;font-size:14px;margin-bottom:6px">${z.name}</div>
            <div style="font-size:12px;color:rgba(148,163,184,0.8);margin-bottom:8px">Zonificación Costos</div>
            <div style="display:flex;justify-content:space-between;margin-bottom:4px">
              <span style="font-size:11px;color:rgba(148,163,184,0.6)">Gasto Registrado:</span>
              <span style="font-size:12px;font-weight:700">$${(gastoCalc/1000000).toFixed(1)}M</span>
            </div>
            <div style="height:6px;background:rgba(255,255,255,0.08);border-radius:99px;overflow:hidden">
              <div style="height:100%;width:75%;background:${color};border-radius:99px"></div>
            </div>
          </div>`
        ).addTo(costosLayer);
        L.marker([z.lat, z.lng], {
          icon: L.divIcon({
            html: `<div style="background:rgba(6,11,24,0.9);border:1px solid ${color};border-radius:6px;padding:3px 7px;font-size:10px;font-weight:700;color:${color};white-space:nowrap;backdrop-filter:blur(8px)">${z.name}</div>`,
            className: '',
            iconAnchor: [0, 0],
          }),
        }).addTo(costosLayer);
        
        // Heatmap for costos
        const intensity = gastoCalc / 20000000;
        for (let i = 0; i < 5; i++) {
          const jlat = z.lat + (Math.random() - 0.5) * 0.008;
          const jlng = z.lng + (Math.random() - 0.5) * 0.008;
          L.circle([jlat, jlng], {
            radius: 180 + intensity * 400,
            color: 'transparent',
            fillColor: \`hsl(\${Math.round((1 - intensity) * 120)}, 90%, 50%)\`,
            fillOpacity: 0.12,
            weight: 0,
          }).addTo(heatmapLayer);
        }
      } else if (z.tipo === 'obras') {
        const progColor = z.estado === 'Terminada' ? '#10b981' : z.estado === 'En ejecución' ? '#3b82f6' : '#f59e0b';
        const iconType = '🏗️';
        const icon = L.divIcon({
          html: \`<div class="obra-marker" style="background:rgba(\${z.estado==='Terminada'?'16,185,129':'245,158,11'},0.9);border-color:rgba(\${z.estado==='Terminada'?'16,185,129':'245,158,11'},0.4);animation:\${z.estado==='Terminada'?'none':'markerPulse 2s ease-in-out infinite'}\">\${iconType}</div>\`,
          className: '',
          iconSize: [36, 36],
          iconAnchor: [18, 18],
        });
        L.marker([z.lat, z.lng], { icon }).bindPopup(`
          <div class="obra-popup" style="color:#f0f4ff;font-family:Inter,sans-serif">
            <div class="obra-popup-title">${iconType} ${z.name}</div>
            <div class="obra-popup-detail">💰 Presupuesto: $${(gastoCalc/1000000).toFixed(1)}M</div>
            <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px">
              <span style="font-size:11px;color:rgba(148,163,184,0.6)">Estado:</span>
              <span style="font-size:13px;font-weight:800;color:${progColor}">${z.estado}</span>
            </div>
          </div>`
        ).addTo(obrasLayer);
      }
    });
    
    // Sidebar update
    function fmt(n) { return '$' + (n/1000000).toFixed(1) + 'M'; }
    document.getElementById('zoneList').innerHTML = ZONAS
      .filter(z => z.tipo === 'costos')
      .map(z => {
        const gastoCalc = z.gasto * multiplier;
        const color = gastoCalc > 15000000 ? '#ef4444' : gastoCalc > 5000000 ? '#f59e0b' : '#10b981';
        return \`<div class="zone-card" onclick="map.setView([\${z.lat},\${z.lng}],15)">
          <div class="zone-name">📍 \${z.name}</div>
          <div class="zone-budget">Gasto: \${fmt(gastoCalc)}</div>
          <div class="zone-bar-wrap"><div class="zone-bar" style="width:75%;background:\${color}"></div></div>
        </div>\`;
      }).join('');

    document.getElementById('obrasList').innerHTML = ZONAS
      .filter(z => z.tipo === 'obras')
      .map(z => {
        const c = z.estado === 'Terminada' ? '#10b981' : z.estado === 'En ejecución' ? '#3b82f6' : '#f59e0b';
        return \`<div style="padding:8px 0;border-bottom:1px solid var(--border);cursor:pointer" onclick="map.setView([\${z.lat},\${z.lng}],16)">
          <div style="font-size:12px;font-weight:700;color:var(--text-primary)">🏗️ \${z.name}</div>
          <div style="display:flex;justify-content:space-between;margin-top:4px;font-size:11px;color:var(--text-muted)">
            <span>\${fmt(z.gasto * multiplier)}</span><span style="color:\${c};font-weight:700">\${z.estado}</span>
          </div>
        </div>\`;
      }).join('');
  }

  // ── TOGGLE CAPAS ─────────────────────────────────────────
  const layers = { costos: costosLayer, obras: obrasLayer, heatmap: heatmapLayer };
  const activeLayers = new Set(['costos']);

  function toggleLayer(name) {
    const btn = document.getElementById('btn' + name.charAt(0).toUpperCase() + name.slice(1));
    if (activeLayers.has(name)) {
      map.removeLayer(layers[name]);
      activeLayers.delete(name);
      btn.classList.remove('active');
    } else {
      layers[name].addTo(map);
      activeLayers.add(name);
      btn.classList.add('active');
    }
    document.getElementById('mapLegend').style.display = activeLayers.has('heatmap') ? 'none' : 'block';
  }

  document.getElementById('periodSelector').addEventListener('change', function(e) {
    const val = e.target.value;
    if (val === 'mensual') multiplier = 1;
    else if (val === 'trimestral') multiplier = 3;
    else multiplier = 12;
    renderLayers();
  });
  
  document.getElementById('btnExportarMapa').addEventListener('click', () => {
    if(typeof showToast !== 'undefined') showToast('Captura generando...', 'info');
    setTimeout(() => {
      if(typeof showToast !== 'undefined') showToast('✅ Mapa exportado como imagen', 'success');
    }, 1500);
  });

  renderLayers();
  costosLayer.addTo(map);

  buildSidebar('mapa');
  </script>
  <script src='js/ux-improvements.js'></script>
  <script src='js/bottom-nav.js'></script>
</body>
</html>
