<!doctype html>
<html class="muni-shell-v1" lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Mapa municipal | MuniControl Junín</title>
  <meta name="description" content="Estado de integración del mapa municipal y las capas territoriales de MuniControl Junín.">
  <link rel="icon" href="img/municontrol-icon.jpg" type="image/jpeg">
  <link rel="stylesheet" href="css/dashboard.css">
  <style>
    html { color-scheme: dark; }
    body { margin: 0; min-width: 320px; background: var(--bg, #07111f); }
    .skip-link { position: fixed; left: 16px; top: -60px; z-index: 10000; padding: 10px 14px; border-radius: 9px; background: #e0f2fe; color: #082f49; font: 700 13px/1 system-ui, sans-serif; }
    .skip-link:focus { top: 16px; }
    .source-noscript { max-width: 720px; margin: 80px auto; padding: 24px; border: 1px solid #334155; border-radius: 16px; color: #e2e8f0; font-family: system-ui, sans-serif; }
  </style>
</head>
<body data-retired-module="mapa" data-source-state="not-connected">
  <a class="skip-link" href="#retired-module-root">Saltar al estado del módulo</a>
  <div id="sidebar-container" aria-label="Navegación principal"></div>
  <main id="retired-module-root" tabindex="-1"></main>
  <noscript><p class="source-noscript"><strong>Sin fuente conectada · no operativo.</strong> No hay obras, reclamos, domicilios ni coordenadas municipales embebidos en esta página.</p></noscript>
  <script src="js/navigation-catalog.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/db.js"></script>
  <script>
    (function initialiseRetiredModule() {
      if (typeof window.buildSidebar === 'function') window.buildSidebar('mapa');
      if (!window.MuniDB || typeof window.MuniDB.mountRetiredModule !== 'function') {
        document.getElementById('retired-module-root').textContent = 'Sin fuente geográfica conectada. Módulo no operativo.';
        return;
      }
      window.MuniDB.mountRetiredModule({ module: 'mapa' });
    })();
  </script>
</body>
</html>
