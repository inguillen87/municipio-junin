  <style>
    :root {
      --bg-card: rgba(30, 41, 59, 0.8);
      --border-color: rgba(255, 255, 255, 0.1);
      --text-muted: #94a3b8;
      --text-color: #f8fafc;
      --radius-lg: 1rem;
      --accent-green: #10b981;
      --accent-blue: #3b82f6;
    }
    body {
      background-color: #0b1329;
      color: var(--text-color);
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    h1, h2, h3, h4, h5, h6 {
      font-family: 'Outfit', sans-serif;
    }
    
    /* Layout */
    .dashboard-container {
      display: flex;
      min-height: 100vh;
    }
    .main-content {
      flex: 1;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }
    
    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .breadcrumbs {
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-bottom: 0.5rem;
    }
    .title {
      font-size: 2rem;
      margin: 0;
    }
    
    /* KPI Cards */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
    }
    .kpi-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }
    .kpi-value {
      font-size: 2.5rem;
      font-weight: 800;
      font-family: 'Outfit', sans-serif;
      margin: 0.5rem 0;
    }
    .kpi-label {
      color: var(--text-muted);
      font-size: 0.875rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    /* Main Layout Grid */
    .content-grid {
      display: grid;
      grid-template-columns: 3fr 1fr;
      gap: 1.5rem;
      align-items: start;
    }
    
    /* Tree Chart Area */
    .tree-container {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 2rem;
      overflow-x: auto;
      backdrop-filter: blur(10px);
      min-height: 500px;
    }
    
    /* CSS Tree Structure */
    .tree {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 20px;
    }
    .tree ul {
      padding-top: 20px;
      position: relative;
      transition: all 0.5s;
      display: flex;
      justify-content: center;
      padding-left: 0;
    }
    .tree li {
      float: left;
      text-align: center;
      list-style-type: none;
      position: relative;
      padding: 20px 10px 0 10px;
      transition: all 0.5s;
    }
    /* Connectors */
    .tree li::before, .tree li::after {
      content: '';
      position: absolute;
      top: 0;
      right: 50%;
      border-top: 2px solid var(--border-color);
      width: 50%;
      height: 20px;
    }
    .tree li::after {
      right: auto;
      left: 50%;
      border-left: 2px solid var(--border-color);
    }
    .tree li:only-child::after, .tree li:only-child::before {
      display: none;
    }
    .tree li:only-child {
      padding-top: 0;
    }
    .tree li:first-child::before, .tree li:last-child::after {
      border: 0 none;
    }
    .tree li:last-child::before {
      border-right: 2px solid var(--border-color);
      border-radius: 0 5px 0 0;
    }
    .tree li:first-child::after {
      border-radius: 5px 0 0 0;
    }
    .tree ul ul::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      border-left: 2px solid var(--border-color);
      width: 0;
      height: 20px;
      transform: translateX(-50%);
    }
    
    /* Node Styles */
    .node-card {
      background: #1e293b;
      border: 1px solid var(--border-color);
      padding: 1rem;
      border-radius: 0.5rem;
      display: inline-block;
      min-width: 150px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .node-card:hover {
      border-color: var(--accent-blue);
      transform: translateY(-2px);
      box-shadow: 0 10px 15px rgba(0,0,0,0.2);
    }
    .node-title {
      font-weight: 600;
      font-size: 0.9rem;
      color: #fff;
      margin-bottom: 0.25rem;
    }
    .node-subtitle {
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    
    .node-card.root {
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(16, 185, 129, 0.2));
      border: 1px solid rgba(59, 130, 246, 0.5);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
    }
    
    /* Side Panel */
    .side-panel {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      max-height: 500px;
    }
    .side-panel h3 {
      margin-top: 0;
      margin-bottom: 1rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.5rem;
    }
    .cc-list {
      list-style: none;
      padding: 0;
      margin: 0;
      overflow-y: auto;
      flex: 1;
    }
    .cc-list::-webkit-scrollbar {
      width: 6px;
    }
    .cc-list::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 3px;
    }
    .cc-item {
      padding: 0.75rem;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.875rem;
      transition: background 0.2s;
    }
    .cc-item:hover {
      background: rgba(255,255,255,0.05);
    }
    .cc-badge {
      background: rgba(59, 130, 246, 0.2);
      color: #93c5fd;
      padding: 0.2rem 0.5rem;
      border-radius: 99px;
      font-size: 0.7rem;
      font-weight: 600;
    }
    
    /* Bottom Table Area */
    .table-container {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      backdrop-filter: blur(10px);
    }
    .table-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    .search-input {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border-color);
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      width: 300px;
      font-family: inherit;
    }
    .search-input:focus {
      outline: none;
      border-color: var(--accent-blue);
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    th, td {
      padding: 1rem;
      border-bottom: 1px solid var(--border-color);
    }
    th {
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.875rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    tbody tr:hover {
      background: rgba(255,255,255,0.02);
    }
    
    /* Responsive */
    @media (max-width: 1024px) {
      .content-grid {
        grid-template-columns: 1fr;
      }
    }
    
    /* Expand/Collapse logic */
    .hidden {
      display: none !important;
    }
  </style>
</head>

      li.appendChild(card);
      
      if (node.children && node.children.length > 0) {
        const ul = document.createElement('ul');
        node.children.forEach(child => {
          ul.appendChild(createTreeNode(child));
        });
        li.appendChild(ul);
        
        // Add click listener to toggle children
        card.addEventListener('click', () => {
          ul.classList.toggle('hidden');
        });

      return li;
