<!doctype html>
<html class="muni-shell-v1" lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Presupuesto y ejecución | MuniControl Junín</title>
  <meta name="description" content="Estado de integración de Presupuesto y ejecución en MuniControl Junín.">
  <link rel="icon" href="img/municontrol-icon.jpg" type="image/jpeg">
  <link rel="stylesheet" href="css/dashboard.css">
  <style>
    html { color-scheme: dark; }
    body { margin: 0; min-width: 320px; background: var(--bg, #07111f); }
    .skip-link { position: fixed; left: 16px; top: -60px; z-index: 10000; padding: 10px 14px; border-radius: 9px; background: #e0f2fe; color: #082f49; font: 700 13px/1 system-ui, sans-serif; }
    .skip-link:focus { top: 16px; }
    .retired-menu { position: fixed; top: 14px; left: 14px; z-index: 999; display: none; min-width: 44px; min-height: 44px; border: 1px solid #334155; border-radius: 11px; background: #0f1f34; color: #e2e8f0; font: 700 12px/1 system-ui, sans-serif; }
    @media (max-width: 900px) { .retired-menu { display: inline-flex; align-items: center; justify-content: center; } }
    .source-noscript { max-width: 720px; margin: 80px auto; padding: 24px; border: 1px solid #334155; border-radius: 16px; color: #e2e8f0; font-family: system-ui, sans-serif; }
  </style>
</head>
<body data-retired-module="presupuesto" data-source-state="not-connected">
  <a class="skip-link" href="#retired-module-root">Saltar al estado del módulo</a>
  <button class="retired-menu" id="menuBtn" type="button" aria-label="Abrir navegación">Menú</button>
  <aside id="sidebar" class="sidebar" aria-label="Navegación principal"></aside>
  <main id="retired-module-root" tabindex="-1"></main>
  <noscript><p class="source-noscript"><strong>Sin fuente conectada · no operativo.</strong> Este módulo requiere JavaScript únicamente para presentar su estado de integración; no hay datos municipales embebidos en la página.</p></noscript>
  <script src="js/navigation-catalog.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/db.js"></script>
  <script>
    (function initialiseRetiredModule() {
      if (!window.MuniDB || typeof window.MuniDB.mountRetiredModule !== 'function') {
        document.getElementById('retired-module-root').textContent = 'Sin fuente conectada. Módulo no operativo.';
        return;
      }
      window.MuniDB.mountRetiredModule({ module: 'presupuesto' });
      if (typeof window.buildSidebar === 'function') window.buildSidebar('presupuesto');
    })();
  </script>
</body>
</html>
