<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#3b82f6" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Municipal Junín" />
  <title>Auditora de Proveedores  Municipalidad de Junín</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/shared.css" />
  <style>
    /* Proveedores PAGE STYLES */
    .prov-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:16px; }
    .prov-card {
      background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius);
      overflow:hidden; transition:var(--transition); cursor:pointer;
    }
    .prov-card:hover { transform:translateY(-3px); box-shadow:0 12px 40px rgba(0,0,0,0.3); }
    .prov-card-header {
      padding:16px; display:flex; align-items:flex-start; gap:12px;
      border-bottom:1px solid var(--border);
    }
    .prov-icon {
      width:44px; height:44px; border-radius:10px; flex-shrink:0;
      display:flex; align-items:center; justify-content:center; font-size:20px;
    }
    .prov-icon.alto   { background:rgba(239,68,68,0.15); border:1px solid rgba(239,68,68,0.3); }
    .prov-icon.medio  { background:rgba(245,158,11,0.15); border:1px solid rgba(245,158,11,0.3); }
    .prov-icon.bajo   { background:rgba(16,185,129,0.15); border:1px solid rgba(16,185,129,0.3); }
    .prov-name { font-size:14px; font-weight:800; margin-bottom:3px; }
    .prov-sistema { font-size:11px; color:var(--text-muted); }
    .prov-riesgo-badge {
      margin-left:auto; font-size:10px; font-weight:800; padding:3px 10px;
      border-radius:99px; flex-shrink:0;
    }
    .riesgo-alto  { background:rgba(239,68,68,0.12); color:#ef4444; border:1px solid rgba(239,68,68,0.25); }
    .riesgo-medio { background:rgba(245,158,11,0.12); color:#f59e0b; border:1px solid rgba(245,158,11,0.25); }
    .riesgo-bajo  { background:rgba(16,185,129,0.12); color:#10b981; border:1px solid rgba(16,185,129,0.25); }
    .prov-body { padding:14px; display:flex; flex-direction:column; gap:8px; }
    .prov-row { display:flex; justify-content:space-between; align-items:center; font-size:12px; }
    .prov-row-label { color:var(--text-muted); }
    .prov-row-val { font-weight:700; }
    .prov-row-val.red   { color:#ef4444; }
    .prov-row-val.green { color:#10b981; }
    .prov-row-val.amber { color:#f59e0b; }
    .prov-row-val.blue  { color:#3b82f6; }
    .prov-flags { display:flex; gap:6px; flex-wrap:wrap; padding:0 14px 14px; }
    .prov-flag {
      font-size:10px; font-weight:700; padding:3px 8px; border-radius:5px;
    }
    .flag-ok     { background:rgba(16,185,129,0.12); color:#10b981; }
    .flag-warn   { background:rgba(245,158,11,0.12); color:#f59e0b; }
    .flag-danger { background:rgba(239,68,68,0.12); color:#ef4444; }
    .prov-card-footer { padding:12px 14px; border-top:1px solid var(--border); display:flex; gap:8px; }
    .btn-detail {
      flex:1; background:rgba(59,130,246,0.08); border:1px solid rgba(59,130,246,0.2);
      color:var(--blue); padding:7px; border-radius:8px; cursor:pointer;
      font-size:12px; font-weight:700; transition:var(--transition); text-align:center;
    }
    .btn-detail:hover { background:rgba(59,130,246,0.18); }
    .btn-ahorro {
      flex:1; background:rgba(16,185,129,0.08); border:1px solid rgba(16,185,129,0.2);
      color:#10b981; padding:7px; border-radius:8px; cursor:pointer;
      font-size:12px; font-weight:700; transition:var(--transition); text-align:center;
    }
    .btn-ahorro:hover { background:rgba(16,185,129,0.18); }

    /* RISK MATRIX */
    .matrix-wrap {
      background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius);
      padding:20px; margin-bottom:20px;
    }
    .matrix-title { font-size:14px; font-weight:700; margin-bottom:16px; }
    .risk-matrix {
      display:grid; grid-template-columns:80px repeat(3,1fr); gap:8px;
    }
    .matrix-header { font-size:11px; font-weight:700; text-align:center; color:var(--text-muted); padding:6px; }
    .matrix-label { font-size:11px; color:var(--text-muted); display:flex; align-items:center; }
    .matrix-cell {
      background:rgba(255,255,255,0.02); border:1px solid var(--border);
      border-radius:8px; padding:8px; min-height:60px;
      display:flex; flex-direction:column; gap:4px; align-items:center; justify-content:center;
    }
    .matrix-cell.rojo   { background:rgba(239,68,68,0.08); border-color:rgba(239,68,68,0.2); }
    .matrix-cell.naranja{ background:rgba(245,158,11,0.06); border-color:rgba(245,158,11,0.2); }
    .matrix-cell.verde  { background:rgba(16,185,129,0.06); border-color:rgba(16,185,129,0.2); }
    .matrix-prov {
      font-size:10px; font-weight:700; background:rgba(255,255,255,0.06);
      border-radius:4px; padding:2px 6px; text-align:center;
    }

    /* SUMMARY BAR */
    .summary-bar {
      display:flex; gap:12px; flex-wrap:wrap; margin-bottom:20px;
    }
    .summary-item {
      background:var(--bg-card); border:1px solid var(--border);
      border-radius:10px; padding:12px 18px; flex:1; min-width:140px;
    }
    .summary-val { font-size:22px; font-weight:900; font-family:'Outfit',sans-serif; }
    .summary-lbl { font-size:11px; color:var(--text-muted); margin-top:3px; }
  </style>
</head>
<body>
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main-content" id="mainContent">
    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-btn" id="menuBtn">?</button>
        <div class="page-title">
          <h1>Auditora de Proveedores</h1>
          <span class="breadcrumb">Junín Control  Análisis de riesgo y dependencia tecnolgica</span>
        </div>
      </div>
      <div class="topbar-right">`n        <button class="icon-btn" id="helpBtn" onclick="if(window.showShortcutsHelp) showShortcutsHelp()" title="Atajos de teclado (?)">?</button>
        <select class="select-filter" id="filtroRiesgo">
          <option value="">Todos los riesgos</option>
          <option>Alto</option><option>Medio</option><option>Bajo</option>
        </select>
        <button class="btn-primary" id="btnExportProv">• Exportar</button>
        <div class="topbar-avatar">MA</div>
      </div>
    </header>
    <div class="content-wrapper">

      <!-- SUMMARY BAR -->
      <div class="summary-bar" id="summaryBar"></div>

      <!-- MATRIX -->
      <div class="matrix-wrap">
        <div class="matrix-title">• Matriz de Riesgo  Dependencia vs Costo</div>
        <div class="risk-matrix" id="riskMatrix">
          <div class="matrix-header"></div>
          <div class="matrix-header" style="color:#ef4444">Alto gasto</div>
          <div class="matrix-header" style="color:#f59e0b">Gasto medio</div>
          <div class="matrix-header" style="color:#10b981">Bajo gasto</div>
          <div class="matrix-label">Riesgo ALTO</div>
          <div class="matrix-cell rojo" id="mc-alto-alto"></div>
          <div class="matrix-cell naranja" id="mc-alto-medio"></div>
          <div class="matrix-cell verde" id="mc-alto-bajo"></div>
          <div class="matrix-label">Riesgo MEDIO</div>
          <div class="matrix-cell naranja" id="mc-medio-alto"></div>
          <div class="matrix-cell naranja" id="mc-medio-medio"></div>
          <div class="matrix-cell verde" id="mc-medio-bajo"></div>
          <div class="matrix-label">Riesgo BAJO</div>
          <div class="matrix-cell verde" id="mc-bajo-alto"></div>
          <div class="matrix-cell verde" id="mc-bajo-medio"></div>
          <div class="matrix-cell verde" id="mc-bajo-bajo"></div>
        </div>
      </div>

      <!-- CARDS -->
      <div class="prov-grid" id="provGrid"></div>
    </div>
  </main>

  <script src='js/db.js'></script>
  <script src="js/pwa.js"></script>
  <script>try{var t=localStorage.getItem('govtech_theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
  <script src='js/db.js'></script>
  <script src="js/nav.js"></script>
  <script>
  const Proveedores = [
    { id:1, nombre:'Sistemas Nexo SA', sistema:'Gestión RRHH y Liquidación', categoria:'Software', mensual:680000, riesgo:'Alto', datos:'No', sla:true, backup:false, lics:50, licsAct:31, venc:'2026-09-01', icon:'•', notas:'Datos de haberes no exportables. Dependencia crtica.', oportunidad:'Renegociar por usuarios activos (19 inactivos). Ahorro $2.28M/año.' },
    { id:2, nombre:'Sipem Sistemas', sistema:'Gestión Tributaria Municipal', categoria:'Software', mensual:520000, riesgo:'Alto', datos:'Parcial', sla:true, backup:true, lics:25, licsAct:22, venc:'2027-03-01', icon:'•', notas:'Crtico para recaudación. Migración compleja.', oportunidad:'Solicitar exportación completa de datos y evaluación de alternativas.' },
    { id:3, nombre:'GovTech Solutions', sistema:'Sistema de Expedientes', categoria:'Software', mensual:420000, riesgo:'Alto', datos:'Parcial', sla:true, backup:true, lics:80, licsAct:52, venc:'2026-08-15', icon:'•', notas:'Renovación automítica en 15 días. 28 licencias sin uso.', oportunidad:'Reemplazar por mídulo propio. Ahorro $5.04M/año.' },
    { id:4, nombre:'Microsoft Argentina', sistema:'Microsoft 365 Licencias', categoria:'Software', mensual:340000, riesgo:'Medio', datos:'Si', sla:true, backup:true, lics:120, licsAct:74, venc:'2026-12-31', icon:'•', notas:'46 licencias inactivas detectadas.', oportunidad:'Reducir a 80 licencias. Ahorro $1.94M/año.' },
    { id:5, nombre:'Telecom Argentina', sistema:'Internet 200Mbps', categoria:'Conectividad', mensual:380000, riesgo:'Bajo', datos:'Si', sla:true, backup:true, lics:0, licsAct:0, venc:'2026-12-01', icon:'•', notas:'Precio competitivo. Contrato vigente.', oportunidad:'Contrato OK. Monitorear velocidad y SLA.' },
    { id:6, nombre:'ControlGas SRL', sistema:'Control de Combustible y Flota', categoria:'Software', mensual:210000, riesgo:'Alto', datos:'No', sla:false, backup:false, lics:10, licsAct:8, venc:'2026-10-01', icon:'?', notas:'Sin exportación de datos. Sistema reemplazable.', oportunidad:'Reemplazar por mídulo propio. Ahorro $2.52M/año.' },
    { id:7, nombre:'Municipaltech Cba', sistema:'Portal del Ciudadano v2.1', categoria:'Web', mensual:295000, riesgo:'Medio', datos:'No', sla:true, backup:false, lics:0, licsAct:0, venc:'2026-08-01', icon:'•', notas:'Sistema desactualizado. Ya reemplazado por MVP.', oportunidad:'Dar de baja al vencimiento. Ahorro $3.54M/año.' },
    { id:8, nombre:'CloudHost Argentina', sistema:'Hosting Sitio Web Oficial', categoria:'Infraestructura', mensual:185000, riesgo:'Bajo', datos:'Si', sla:false, backup:true, lics:0, licsAct:0, venc:'2026-07-31', icon:'•', notas:'Migrado a Vercel. Contrato ya vencido.', oportunidad:'YA EJECUTADO. Ahorro $2.22M/año.' },
    { id:9, nombre:'DataCenter BsAs', sistema:'Colocation Rack Servidor', categoria:'Infraestructura', mensual:165000, riesgo:'Bajo', datos:'Si', sla:true, backup:true, lics:0, licsAct:0, venc:'2026-09-30', icon:'•', notas:'Alternativa: rack propio del municipio.', oportunidad:'Evaluar rack local con Docker Compose.' },
    { id:10, nombre:'TeleSoporte SRL', sistema:'Mesa de Ayuda Externo', categoria:'Soporte', mensual:145000, riesgo:'Bajo', datos:'Si', sla:true, backup:false, lics:0, licsAct:0, venc:'2026-11-01', icon:'•', notas:'Posible internalización con nuevo equipo IT.', oportunidad:'Evaluar con el nuevo equipo de tecnologa.' },
    { id:11, nombre:'Correo Argentino', sistema:'Servicio de Notificaciones', categoria:'Servicios', mensual:95000, riesgo:'Bajo', datos:'Si', sla:false, backup:false, lics:0, licsAct:0, venc:'2027-01-01', icon:'•', notas:'Reemplazable por email/WhatsApp automítico.', oportunidad:'Reemplazar por Resend o SMTP propio. Ahorro $1.14M/año.' },
    { id:12, nombre:'Antivirus Corp ARG', sistema:'Licencias Antivirus Corporativo', categoria:'Software', mensual:78000, riesgo:'Bajo', datos:'Si', sla:false, backup:false, lics:200, licsAct:140, venc:'2026-09-01', icon:'•?', notas:'60 licencias sin uso activo.', oportunidad:'Reducir a 145. Ahorro $660K/año.' },
  ];

  const fmt = n => '$' + Math.round(n).toLocaleString('es-AR');
  const diasHasta = s => s ? Math.round((new Date(s)-new Date())/86400000) : 9999;
  const fmtDate = s => s ? new Date(s).toLocaleDateString('es-AR') : '';

  document.addEventListener('DOMContentLoaded', () => {
    buildSidebar('Proveedores');
    renderSummary();
    renderMatrix();
    renderCards();

    document.getElementById('filtroRiesgo').addEventListener('change', e => renderCards(e.target.value));
    document.getElementById('btnExportProv').addEventListener('click', exportCSV);
  });

  function renderSummary() {
    const total = Proveedores.reduce((s,p)=>s+p.mensual,0);
    const altos = Proveedores.filter(p=>p.riesgo==='Alto').length;
    const sinDatos = Proveedores.filter(p=>p.datos==='No').length;
    const venc60 = Proveedores.filter(p=>{const d=diasHasta(p.venc); return d>=0&&d<=60;}).length;
    const licsSinUso = Proveedores.reduce((s,p)=>s+(p.lics-p.licsAct),0);
    document.getElementById('summaryBar').innerHTML = [
      { val: fmt(total), lbl:'Gasto mensual total', col:'red' },
      { val: altos, lbl:'Proveedores riesgo ALTO', col:'red' },
      { val: sinDatos, lbl:'Sin datos propios', col:'amber' },
      { val: venc60, lbl:'Vencen en 60 días', col:'amber' },
      { val: licsSinUso, lbl:'Licencias sin uso', col:'blue' },
    ].map(i=>`<div class="summary-item"><div class="summary-val" style="color:var(--${i.col})">${i.val}</div><div class="summary-lbl">${i.lbl}</div></div>`).join('');
  }

  function renderMatrix() {
    const gastoBuckets = ['alto','medio','bajo'];
    const costoThresholds = [400000, 200000];
    const getCostoBucket = m => m>=costoThresholds[0]?'alto':m>=costoThresholds[1]?'medio':'bajo';
    Proveedores.forEach(p => {
      const rk = p.riesgo.toLowerCase();
      const ck = getCostoBucket(p.mensual);
      const cell = document.getElementById(`mc-${rk}-${ck}`);
      if (cell) {
        const chip = document.createElement('div');
        chip.className = 'matrix-prov';
        chip.textContent = p.nombre.split(' ')[0];
        chip.title = p.nombre + '  ' + fmt(p.mensual);
        cell.appendChild(chip);
      }
    });
  }

  function renderCards(filtro='') {
    const data = filtro ? Proveedores.filter(p=>p.riesgo===filtro) : Proveedores;
    document.getElementById('provGrid').innerHTML = data.map(p => {
      const dias = diasHasta(p.venc);
      const vencClass = dias<=0?'red':dias<=30?'red':dias<=90?'amber':'green';
      const vencLabel = dias<=0?'VENCIDO':dias<=30?`• ${dias}d`:dias<=90?`? ${dias}d`:fmtDate(p.venc);
      const flags = [
        p.sla    ? {t:'SLA',c:'flag-ok'} : {t:'Sin SLA',c:'flag-danger'},
        p.backup ? {t:'Backup',c:'flag-ok'} : {t:'Sin Backup',c:'flag-danger'},
        {t:'Datos: '+p.datos, c:p.datos==='Si'?'flag-ok':p.datos==='Parcial'?'flag-warn':'flag-danger'},
        p.lics>0 ? {t:`${p.licsAct}/${p.lics} lic.`,c:p.licsAct/p.lics<0.8?'flag-warn':'flag-ok'} : null,
      ].filter(Boolean);
      return `
        <div class="prov-card">
          <div class="prov-card-header">
            <div class="prov-icon ${p.riesgo.toLowerCase()}">${p.icon}</div>
            <div style="flex:1;min-width:0">
              <div class="prov-name">${p.nombre}</div>
              <div class="prov-sistema">${p.sistema}</div>
            </div>
            <span class="prov-riesgo-badge riesgo-${p.riesgo.toLowerCase()}">${p.riesgo}</span>
          </div>
          <div class="prov-body">
            <div class="prov-row"><span class="prov-row-label">Costo mensual</span><span class="prov-row-val red">${fmt(p.mensual)}</span></div>
            <div class="prov-row"><span class="prov-row-label">Costo anual</span><span class="prov-row-val red">${fmt(p.mensual*12)}</span></div>
            <div class="prov-row"><span class="prov-row-label">Vencimiento</span><span class="prov-row-val ${vencClass}">${vencLabel}</span></div>
            <div class="prov-row"><span class="prov-row-label">Área</span><span class="prov-row-val blue">${p.categoria}</span></div>
            <div style="font-size:11px;color:var(--text-muted);background:rgba(255,255,255,0.02);border-radius:6px;padding:8px;margin-top:2px;">${p.notas}</div>
            <div style="font-size:11px;color:#10b981;background:rgba(16,185,129,0.06);border:1px solid rgba(16,185,129,0.15);border-radius:6px;padding:8px;">• ${p.oportunidad}</div>
          </div>
          <div class="prov-flags">${flags.map(f=>`<span class="prov-flag ${f.c}">${f.t}</span>`).join('')}</div>
          <div class="prov-card-footer">
            <button class="btn-detail" onclick="alert('Detalle: ${p.nombre}\\nSistema: ${p.sistema}\\nCUIT: pendiente de relevamiento')">• Detalle</button>
            <button class="btn-ahorro" onclick="window.location.href='control.html'">• Ver ahorro</button>
          </div>
        </div>`;
    }).join('');
  }

  function exportCSV() {
    const rows = [['Proveedor','Sistema','Costo Mensual','Costo Anual','Vencimiento','Riesgo','Datos Propios','SLA','Backup','Licencias','Activas','Oportunidad']];
    Proveedores.forEach(p => rows.push([p.nombre,p.sistema,p.mensual,p.mensual*12,p.venc,p.riesgo,p.datos,p.sla?'Si':'No',p.backup?'Si':'No',p.lics,p.licsAct,p.oportunidad]));
    const csv = rows.map(r=>r.map(v=>'"'+String(v||'').replace(/"/g,'""')+'"').join(',')).join('\n');
    const a = document.createElement('a');
    a.href = 'data:text/csv;charset=utf-8,\uFEFF'+encodeURIComponent(csv);
    a.download = 'auditoria-Proveedores-junin.csv';
    a.click();
  }
  </script>
  <script src='js/db.js'></script>
  <script src='js/motion-kit.js'></script>
  <script src='js/ux-improvements.js'></script>
  <script src='js/db.js'></script>
  <script src='js/bottom-nav.js'></script>
  <script src='js/notifications.js'></script>
  <script src='js/chat-widget.js'></script>
  <script src='js/theme-switcher.js'></script>
</body>
</html>
