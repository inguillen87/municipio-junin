<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recursos Humanos | MuniControl</title>
  <link rel="icon" href="img/municontrol-icon.jpg" type="image/jpeg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/dashboard.css">
  <style>
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
    .kpi-card { background: var(--bg-card); padding: 1.5rem; border-radius: var(--radius-lg); border: 1px solid var(--border-color); display: flex; align-items: flex-start; gap: 1rem; }
    .kpi-icon { background: rgba(59, 130, 246, 0.1); color: #3b82f6; padding: 0.75rem; border-radius: 0.5rem; }
    .kpi-content { flex: 1; }
    .kpi-label { color: var(--text-muted); font-size: 0.875rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
    .kpi-value { font-size: 1.75rem; font-weight: 700; margin-top: 0.25rem; font-family: 'Outfit', sans-serif; }
    
    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th, .data-table td { padding: 1rem; text-align: left; border-bottom: 1px solid var(--border-color); }
    .data-table th { background: rgba(0,0,0,0.2); font-weight: 600; font-size: 0.875rem; color: var(--text-muted); text-transform: uppercase; }
    .badge { padding: 0.25rem 0.75rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
    .badge-activo { background: rgba(16, 185, 129, 0.2); color: #10b981; }
    .badge-licencia { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
    
    .table-container { background: var(--bg-card); padding: 1.5rem; border-radius: var(--radius-lg); border: 1px solid var(--border-color); overflow-x: auto; }
  </style>
</head>
<body>
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main-content" id="mainContent">
    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-btn" id="menuBtn" aria-label="Menu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="page-title">
          <h1>Recursos Humanos</h1>
          <span class="breadcrumb">Nomina y Personal</span>
        </div>
      </div>
      <div class="topbar-right">
        <div class="topbar-avatar" id="topbarAvatar">SA</div>
      </div>
    </header>
    
    <div class="content-wrapper">
      <div class="kpi-grid">
        <div class="kpi-card">
          <div class="kpi-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
          <div class="kpi-content">
            <div class="kpi-label">Total Activos</div>
            <div class="kpi-value" id="kpiActivos">1,245</div>
          </div>
        </div>
        <div class="kpi-card">
          <div class="kpi-icon" style="color: #10b981; background: rgba(16, 185, 129, 0.1);"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div>
          <div class="kpi-content">
            <div class="kpi-label">Masa Salarial</div>
            <div class="kpi-value" id="kpiSalarial">$84.5M</div>
          </div>
        </div>
        <div class="kpi-card">
          <div class="kpi-icon" style="color: #ef4444; background: rgba(239, 68, 68, 0.1);"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg></div>
          <div class="kpi-content">
            <div class="kpi-label">Ausentismo</div>
            <div class="kpi-value">4.2%</div>
          </div>
        </div>
        <div class="kpi-card">
          <div class="kpi-icon" style="color: #8b5cf6; background: rgba(139, 92, 246, 0.1);"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>
          <div class="kpi-content">
            <div class="kpi-label">Horas Extra</div>
            <div class="kpi-value">1,250h</div>
          </div>
        </div>
      </div>

      <div class="table-container">
        <h2 style="margin-top:0; font-size: 1.25rem; font-weight: 600; margin-bottom: 1rem;">Directorio de Empleados</h2>
        <table class="data-table">
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Secretaria</th>
              <th>Cargo</th>
              <th>Salario</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody id="empleadosTableBody">
          </tbody>
        </table>
      </div>
    </div>
  </main>
  
  <script src="js/nav.js"></script>
  <script>buildSidebar('rrhh');</script>
  <script src="js/db.js"></script>
  <script>
  document.addEventListener('DOMContentLoaded', function() {
    if (window.MuniDB) {
      const empleados = MuniDB.getAll('empleados') || [];
      const tbody = document.getElementById('empleadosTableBody');
      let activos = 0;
      let masaSalarial = 0;

      empleados.forEach(emp => {
        if(emp.estado === 'Activo') activos++;
        masaSalarial += emp.salario;

        const tr = document.createElement('tr');
        const estadoClass = emp.estado === 'Activo' ? 'badge-activo' : 'badge-licencia';
        const formattedSalario = new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS' }).format(emp.salario);
        
        tr.innerHTML = `
          <td><strong>${emp.nombre}</strong></td>
          <td>${emp.secretaria}</td>
          <td>${emp.cargo}</td>
          <td style="font-family: 'Outfit', sans-serif;">${formattedSalario}</td>
          <td><span class="badge ${estadoClass}">${emp.estado}</span></td>
        `;
        tbody.appendChild(tr);
      });

      if(empleados.length > 0) {
        document.getElementById('kpiActivos').textContent = activos.toLocaleString('es-AR');
        document.getElementById('kpiSalarial').textContent = '$' + (masaSalarial / 1000000).toFixed(1) + 'M';
      }
    }
  });
  </script>
  <script src="js/theme-switcher.js"></script>
  <script src='js/bottom-nav.js'></script>
</body>
</html>
