<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atencion al Vecino | MuniControl</title>
  <link rel="icon" href="img/municontrol-icon.jpg" type="image/jpeg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/dashboard.css">
  <style>
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
    .kpi-card { background: var(--bg-card); padding: 1.5rem; border-radius: var(--radius-lg); border: 1px solid var(--border-color); display: flex; align-items: flex-start; gap: 1rem; }
    .kpi-icon { background: rgba(59, 130, 246, 0.1); color: #3b82f6; padding: 0.75rem; border-radius: 0.5rem; }
    .kpi-content { flex: 1; }
    .kpi-label { color: var(--text-muted); font-size: 0.875rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
    .kpi-value { font-size: 1.75rem; font-weight: 700; margin-top: 0.25rem; font-family: 'Outfit', sans-serif; }
    
    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th, .data-table td { padding: 1rem; text-align: left; border-bottom: 1px solid var(--border-color); }
    .data-table th { background: rgba(0,0,0,0.2); font-weight: 600; font-size: 0.875rem; color: var(--text-muted); text-transform: uppercase; }
    .badge { padding: 0.25rem 0.75rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
    .badge-resuelto { background: rgba(16, 185, 129, 0.2); color: #10b981; }
    .badge-pendiente { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
    .badge-en-proceso { background: rgba(59, 130, 246, 0.2); color: #3b82f6; }
    
    .table-container { background: var(--bg-card); padding: 1.5rem; border-radius: var(--radius-lg); border: 1px solid var(--border-color); overflow-x: auto; }
  </style>
</head>
<body>
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main-content" id="mainContent">
    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-btn" id="menuBtn" aria-label="Menu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="page-title">
          <h1>Atencion al Vecino</h1>
          <span class="breadcrumb">Sistema 311 - Reclamos</span>
        </div>
      </div>
      <div class="topbar-right">
        <div class="topbar-avatar" id="topbarAvatar">SA</div>
      </div>
    </header>
    
    <div class="content-wrapper">
      <div class="kpi-grid">
        <div class="kpi-card">
          <div class="kpi-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg></div>
          <div class="kpi-content">
            <div class="kpi-label">Total Reclamos</div>
            <div class="kpi-value" id="kpiTotal">0</div>
          </div>
        </div>
        <div class="kpi-card">
          <div class="kpi-icon" style="color: #10b981; background: rgba(16, 185, 129, 0.1);"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></div>
          <div class="kpi-content">
            <div class="kpi-label">Resueltos</div>
            <div class="kpi-value" id="kpiResueltos">0</div>
          </div>
        </div>
        <div class="kpi-card">
          <div class="kpi-icon" style="color: #f59e0b; background: rgba(245, 158, 11, 0.1);"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div>
          <div class="kpi-content">
            <div class="kpi-label">Pendientes</div>
            <div class="kpi-value" id="kpiPendientes">0</div>
          </div>
        </div>
        <div class="kpi-card">
          <div class="kpi-icon" style="color: #8b5cf6; background: rgba(139, 92, 246, 0.1);"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></div>
          <div class="kpi-content">
            <div class="kpi-label">SLA Cumplido</div>
            <div class="kpi-value">92%</div>
          </div>
        </div>
      </div>

      <div class="table-container">
        <h2 style="margin-top:0; font-size: 1.25rem; font-weight: 600; margin-bottom: 1rem;">Ultimos Reclamos 311</h2>
        <table class="data-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Vecino</th>
              <th>Categoria</th>
              <th>Barrio</th>
              <th>Estado</th>
              <th>Dias</th>
            </tr>
          </thead>
          <tbody id="reclamosTableBody">
          </tbody>
        </table>
      </div>
    </div>
  </main>
  
  <script src="js/nav.js"></script>
  <script>buildSidebar('vecinos');</script>
  <script src="js/db.js"></script>
  <script>
  document.addEventListener('DOMContentLoaded', function() {
    if (window.MuniDB) {
      const reclamos = MuniDB.getAll('reclamos') || [];
      const tbody = document.getElementById('reclamosTableBody');
      let resueltos = 0;
      let pendientes = 0;

      reclamos.forEach(req => {
        if(req.estado === 'Resuelto') resueltos++;
        if(req.estado === 'Pendiente') pendientes++;
        
        const tr = document.createElement('tr');
        let badgeClass = 'badge-en-proceso';
        if (req.estado === 'Resuelto') badgeClass = 'badge-resuelto';
        if (req.estado === 'Pendiente') badgeClass = 'badge-pendiente';

        tr.innerHTML = `
          <td style="font-family: 'Outfit', sans-serif; color: var(--text-muted);">#${req.id}</td>
          <td><strong>${req.vecino}</strong></td>
          <td>${req.categoria}</td>
          <td>${req.barrio}</td>
          <td><span class="badge ${badgeClass}">${req.estado}</span></td>
          <td style="font-family: 'Outfit', sans-serif;">${req.diasAbierto}d</td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById('kpiTotal').textContent = reclamos.length.toLocaleString('es-AR');
      document.getElementById('kpiResueltos').textContent = resueltos.toLocaleString('es-AR');
      document.getElementById('kpiPendientes').textContent = pendientes.toLocaleString('es-AR');
    }
  });
  </script>
</body>
</html>
